# Weekly version updates for the Cargo workspace and the GitHub Actions in .github/workflows.
# Minor and patch updates arrive as one grouped pull request per ecosystem; major updates get a
# pull request each, since they can change behaviour. A new release is proposed only after it
# has been out for a week (cooldown), so a compromised or yanked release has time to surface.
# Security updates are separate: they follow the repository's Dependabot alert settings and
# ignore the schedule, grouping and cooldown below.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [major, minor, patch]
