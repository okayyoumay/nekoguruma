[package]
name = "agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ngr-agent"
path = "src/main.rs"

[dependencies]
shared-proto.workspace = true
diag-ir.workspace = true
worker-host.workspace = true
j2534-0404-registry.workspace = true
ngr-library-resolver.workspace = true
vci-service-config.workspace = true
ngr-oplog.workspace = true
shared-crypto.workspace = true
tracing-subscriber.workspace = true
vci-service-interface.workspace = true
tokio.workspace = true
tonic = "0.14.6"
axum.workspace = true
serde.workspace = true
postcard.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
tracing.workspace = true
base64.workspace = true
# The registration command's HTTP/1 client (ADR-470): hyper's client connection over a TCP stream
# the agent opens itself, with no pool, no name resolution and no redirect handling.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# The control channel session library's WebSocket client (ADR-466, ADR-471): the handshake and the
# framing over a stream the agent opens itself, with no TLS, no name resolution and no
# redirects. `futures-util` is the stream and sink traits the WebSocket type is used through.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The control channel's loop tests run on a paused clock (ADR-471).
tokio = { workspace = true, features = ["test-util"] }
diag-frontend = { path = "../diag-frontend" }
sim-ecu.workspace = true
tempfile = "3"
tracing-core = "0.1"
