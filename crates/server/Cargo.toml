[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ngr-server"
path = "src/main.rs"

[dependencies]
shared-proto.workspace = true
diag-ir.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
url.workspace = true
# The server serves HTTP/1 only (ADR-456), so it drives hyper directly instead of `axum::serve`,
# which also accepts HTTP/2 whenever another crate in the build turns that feature on.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server-graceful"] }
tower = { version = "0.5", default-features = false }

[dev-dependencies]
tempfile = "3"
getrandom.workspace = true
