name: CodeQL alert hand-off

# Sends the open CodeQL alerts on main to the Claude routine that runs the codeql-alerts skill
# (.claude/skills/codeql-alerts). Claude sessions cannot read code scanning alerts, so this
# workflow reads them with its own token and passes a trimmed list in the routine's fire request.
# The alerts are never written to the log or to an artifact: the repository is public.
#
# Setup: repository variable NGR_CODEQL_ROUTINE_ID (the routine's trig_... id) and repository
# secret NGR_CODEQL_ROUTINE_TOKEN (the routine's API trigger token). Without them the job only
# prints a notice.
on:
  schedule:
    - cron: "47 23 * * 2" # Wednesday 08:47 JST
  # A merged fix frees the loop for the next alert. Actions has no code scanning alert event, so
  # the job runs when CodeQL default setup (workflow name "CodeQL") finishes analysing a push to
  # main, and continues only when that commit merged a codeql PR.
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  pull-requests: read

concurrency:
  group: codeql-alert-handoff
  cancel-in-progress: false

jobs:
  handoff:
    # An analysis that did not succeed leaves the alerts stale: send nothing. (Default setup's
    # runs report the event `dynamic`, not `push`; the merged-PR check below does the filtering.)
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ROUTINE_ID: ${{ vars.NGR_CODEQL_ROUTINE_ID }}
      ROUTINE_TOKEN: ${{ secrets.NGR_CODEQL_ROUTINE_TOKEN }}
    steps:
      - name: Hand the open alerts to the routine
        run: |
          set -euo pipefail
          if [ -z "$ROUTINE_ID" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "::notice::NGR_CODEQL_ROUTINE_ID or NGR_CODEQL_ROUTINE_TOKEN is not set; nothing sent."
            exit 0
          fi

          # After an analysis of main, continue only if the analysed commit merged a codeql PR
          # from this repository.
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            sha=$(jq -r .workflow_run.head_sha "$GITHUB_EVENT_PATH")
            merged=$(gh api "repos/$REPO/commits/$sha/pulls" \
              --jq '[.[] | select(.merged_at != null and .head.repo.full_name == env.REPO
                                  and (.labels | map(.name) | index("codeql")))] | length')
            if [ "$merged" -eq 0 ]; then
              echo "The analysed commit did not merge a codeql PR; nothing sent."
              exit 0
            fi
            sleep 30 # alert states update shortly after the analysis upload
          fi

          # One task at a time across both loops (ADR-243): while a loop PR is open, the routine
          # would only stop again, so do not start it.
          claims=$(gh pr list --repo "$REPO" --state open --limit 1000 \
            --json number,title,labels,isCrossRepository \
            --jq '[.[] | select((.labels | map(.name) | any(. == "codeql" or . == "backlog-loop"))
                     or ((.isCrossRepository | not)
                         and (.title | startswith("[codeql]") or startswith("[backlog-loop]"))))
                   | .number] | length')
          if [ "$claims" -gt 0 ]; then
            echo "A codeql or backlog-loop PR is open; nothing sent."
            exit 0
          fi

          gh api --paginate \
            "repos/$REPO/code-scanning/alerts?state=open&ref=refs/heads/main&tool_name=CodeQL&per_page=100" \
            > alerts.json
          count=$(jq -s 'add | length' alerts.json)
          if [ "$count" -eq 0 ]; then
            echo "No open CodeQL alerts on main; nothing sent."
            exit 0
          fi

          # Keep only the fields the skill uses and stay under the fire request's 64 KiB text
          # limit. High and critical alerts go in `private` with the same details, in a share of
          # their own (at most 28000 bytes), so neither list crowds out the other; `alerts` gets
          # the rest of 58000 bytes. `alerts` keeps its most urgent part, since a fixed or
          # dismissed alert makes room for the next. Private alerts can stay open longer, so
          # when they do not all fit, each run starts its window further along the list (by run
          # number) and every one is sent over successive runs.
          jq -s -c --arg repo "$REPO" --argjson run "$GITHUB_RUN_NUMBER" '
            def high: .rule.security_severity_level == "critical"
                      or .rule.security_severity_level == "high";
            def urgency:
              sort_by(
                ({"critical": 0, "high": 1, "medium": 2, "low": 3}[.security_severity // ""] // 4),
                ({"error": 0, "warning": 1, "note": 2}[.severity // ""] // 3),
                .created_at, .number);
            def slim:
              map({
                number,
                rule: .rule.id,
                security_severity: .rule.security_severity_level,
                severity: .rule.severity,
                path: .most_recent_instance.location.path,
                start_line: .most_recent_instance.location.start_line,
                end_line: .most_recent_instance.location.end_line,
                message: (.most_recent_instance.message.text // "" | .[0:300]),
                created_at
              }) | urgency;
            # The longest prefix whose JSON fits in $budget bytes.
            def fit($budget):
              reduce .[] as $a ({out: [], size: 2, full: false};
                if .full then .
                else ($a | tojson | utf8bytelength + 1) as $n
                  | if .size + $n > $budget then .full = true
                    else .out += [$a] | .size += $n end
                end) | .out;
            add
            | (map(select(high)) | slim) as $p
            | (map(select(high | not)) | slim) as $rest
            | ($p | fit(28000) | length) as $k
            | (if $k < ($p | length)
                 then (($run - 1) * $k % ($p | length)) as $o
                      | ($p[$o:] + $p[:$o]) | fit(28000) | urgency
                 else $p end) as $private
            | {repository: $repo, ref: "refs/heads/main", total: length,
               private_total: ($p | length), private: $private, alerts: []}
            | (tojson | utf8bytelength) as $used
            | .alerts = ($rest | fit(58000 - $used))' alerts.json > payload.json
          size=$(wc -c < payload.json)
          if [ "$size" -gt 60000 ]; then
            echo "::error::The alert payload is $size bytes, over the 60000-byte budget."
            exit 1
          fi

          # The response and the payload stay out of the log. The token reaches curl on stdin
          # (printf is a builtin), so it never appears in a process's command line.
          jq -n -c --rawfile text payload.json '{text: $text}' > body.json
          status=$(printf 'Authorization: Bearer %s\n' "$ROUTINE_TOKEN" \
            | curl -sS -o /dev/null -w '%{http_code}' \
                -X POST "https://api.anthropic.com/v1/claude_code/routines/$ROUTINE_ID/fire" \
                -H @- \
                -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
                -H "anthropic-version: 2023-06-01" \
                -H "Content-Type: application/json" \
                --data-binary @body.json)
          rm -f alerts.json payload.json body.json
          echo "Sent $count open alerts; routine fire returned HTTP $status."
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
