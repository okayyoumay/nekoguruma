[package]
name = "ngr-hw-checks"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
agent = { path = "../agent" }
diag-frontend = { path = "../diag-frontend" }
diag-ir = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tonic = "0.14.6"
vci-service-config = { workspace = true }
vci-service-interface = { workspace = true }
worker-host = { workspace = true }

# The SocketCAN end of a T0 loopback (`guard::socketcan`) uses the Linux raw CAN socket.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
