[package]
name = "iso22900-service"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
eventlog = ["vci-service-launcher/eventlog"]
journald = ["vci-service-launcher/journald"]
config-root-exe-dir = ["vci-service-launcher/config-root-exe-dir"]
config-root-win-local-app-data = ["vci-service-launcher/config-root-win-local-app-data"]
config-root-win-roaming-app-data = ["vci-service-launcher/config-root-win-roaming-app-data"]
config-root-win-program-files = ["vci-service-launcher/config-root-win-program-files"]
config-root-win-program-files-x86 = ["vci-service-launcher/config-root-win-program-files-x86"]

[dependencies]
iso22900.workspace = true
iso22900-registry = { workspace = true }
iso22900-sys = { workspace = true }
ngr-library-resolver = { workspace = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "io-util", "io-std", "process"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic = "0.14.6"
url = "2.5.7"
vci-service-launcher = { workspace = true }
vci-service-interface = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# tests/hw_open.rs opens the check harness's device through this service.
ngr-hw-checks = { path = "../ngr-hw-checks" }
# tests/agent_launch.rs launches this service through the agent's launch path.
agent = { path = "../agent" }
# tests/ngr_agent_dpdu_end_to_end.rs writes and reads diag-ir programs and states.
diag-ir = { workspace = true }
# tests/ngr_agent_definition_end_to_end.rs converts the example ECU and writes its documents.
diag-frontend = { path = "../diag-frontend" }
postcard = { workspace = true }
iso22900-mock = { workspace = true }
worker-host = { workspace = true }
serial_test = "3"
tempfile = "3"
serde_json = "1"
