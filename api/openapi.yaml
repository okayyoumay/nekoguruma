openapi: 3.1.0
info:
  title: Vehicle Diagnostic System API
  version: 0.1.0
  description: |
    Corresponds to the design document system-architecture.md.

    Separates the SOVD-compliant part from proprietary extensions (8.7).
    - `/v1/sovd/**` : Compliant with the SOVD resource model
    - `/v1/**`      : Specific to this system (jobs, agents, artifacts, extensions)

    Authentication is OIDC (Bearer) on the standard deployment, which is consistent with SOVD
    assuming OAuth2. The local deployment authenticates local users instead (13, 13.3,
    ADR-469): `POST /v1/login` sets the `ngr_session` cookie, and every operator route takes
    that cookie in place of a bearer token.

servers:
  - url: https://example.com/api
    description: Standard deployment
  - url: http://127.0.0.1:8080/api
    description: Local deployment (chapter 13)

security:
  - bearerAuth: []
  - operatorSession: []

tags:
  - name: jobs
  - name: agents
  - name: artifacts
  - name: extensions
  - name: data
  - name: sovd
  - name: system

paths:
  # ------------------------------------------------------------ System
  /v1/health:
    get:
      tags: [system]
      summary: Liveness and readiness probe
      description: |
        Needs no login: the installer, the service manager and tests probe it before any user
        exists. The server runs `SELECT 1` on its database: 200 when it answers within 2 seconds,
        otherwise 503 as a problem document with no detail. The body holds nothing else, since
        other OS users can reach it (13.3). Like every route of the local deployment it is
        subject to the Host and Origin rules of 13.3.
      security: []
      responses:
        '200':
          description: The server is serving and its database answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: The database does not answer within 2 seconds, or answers with an error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------ Jobs
  /v1/jobs:
    post:
      tags: [jobs]
      summary: Issue a job
      description: |
        The server checks permissions (6.8) and compatibility, generates a signed job instruction
        (one envelope of a key fingerprint, a signature and a postcard payload that names the
        job's documents by hash, 11.1, ADR-461), and delivers it to the target agent. Operations requiring seed-key or OEM authentication
        must be online (5.7).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
      responses:
        '202':
          description: Accepted (delivery is asynchronous)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Target VCI or vehicle is in use (soft lock, 8.8)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Get job status
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }

  /v1/jobs/{jobId}/cancel:
    post:
      tags: [jobs]
      summary: Request cancellation
      description: |
        Does not take effect immediately. In an uninterruptible section (8.10.1) the request is held,
        and the job transitions to cancelled once it reaches an interruptible point.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202': { description: Cancellation request accepted }

  /v1/jobs/{jobId}/hmi/{requestId}:
    post:
      tags: [jobs]
      summary: Respond to an HMI request (8.6)
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204': { description: Accepted }

  /v1/jobs/{jobId}/offline-package:
    get:
      tags: [jobs]
      summary: Get the offline job package (5.7)
      description: |
        Returns the signed job instruction, references to ECU artifacts, the IR documents, and an offline token
        together. The expiry is short: the agent judges it by the signed instruction's start deadline (5.3, 11.1).
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfflinePackage' }
        '409':
          description: Cannot start offline (seed-key or OEM authentication required)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------ Agents
  /v1/agents:
    get:
      tags: [agents]
      summary: List operable agents
      description: Returns only agents whose allowed-user list includes the caller (6.6).
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }

  /v1/agents/{agentId}:
    get:
      tags: [agents]
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }

  /v1/agents/{agentId}/revoke:
    post:
      tags: [agents]
      summary: Revoke an agent key (16.3)
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '204': { description: Revoked }

  /v1/agents/register:
    post:
      tags: [agents]
      summary: Register an agent with a registration code (6.4, 6.7, ADR-463)
      description: |
        Needs no login: the agent has no session. What authorizes the request is a single-use
        registration code that an administrator issued with the server's `registration-code`
        command, bound to the agent key's fingerprint and to an owner. The device authorization
        flow is not offered.

        The checks run in this order: the request guard (13.3), the method (**405**, with `Allow`),
        the body (read within 5 seconds, **408**; at most 4 KiB, **413**), the shape (**400**),
        the proof, then the database.

        **400** is decided on the shape of the request alone, before and without any database
        lookup: a `Content-Type` other than `application/json` (parameters allowed; it is 400,
        not 415), a code whose prefix, length or alphabet is wrong, a `publicKey` that is not a
        parsable SPKI PEM, a `proof` that is not standard padded base64 or does not decode to
        exactly 64 bytes, a `mode` outside the enum, a missing, unknown or duplicate field, a field
        that is not a string, bytes after the JSON value, or a body that is not a JSON object.

        **403** is the one uniform refusal for everything that needs the database or the
        signature check: an unknown, expired, used or revoked code, a key other than the one the
        code is bound to, a bad proof, a code issued under an instruction key that is no longer
        active, an owner who was disabled since issuance. The caller cannot tell these apart; the reason goes to the server's log only.
        Refusals are limited for the whole route, not per caller: once ten 403 responses were
        given within the last minute, a request that would be refused is answered 429 until the
        oldest of those ten is a minute old. Only 403 counts
        toward the limit (400, 405, 408, 413, 429 and 5xx do not). A request that redeems successfully (valid
        code, valid proof) succeeds even while the limit is exceeded, so the limit only slows
        guessing and gives a guesser no oracle. The body is at most 4 KiB (413).

        **503** is returned when the database cannot be reached or a statement fails or times out
        (5 seconds); **500** when the server's signer fails. Neither counts toward the limit, and
        the code stays redeemable, since the registration is written in one transaction that
        commits only after the response is signed.

        On success the server assigns the agent ID, stores the key and the owner, revokes earlier
        unrevoked rows of the same key, and returns the instruction key the agent will pin with
        its signature over what it assigned. The response is not replayed: an agent that did not
        receive it needs a new code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, publicKey, mode, proof]
              properties:
                code:
                  type: string
                  maxLength: 64
                  description: |
                    The registration code: the prefix `ngr1-` and 26 Crockford base32 digits. The
                    server reads it as the agent does (ASCII whitespace at the ends trimmed, case
                    ignored, `I` and `L` as `1`, `O` as `0`); its canonical text is hashed.
                publicKey:
                  type: string
                  maxLength: 512
                  description: The agent key as an SPKI PEM document
                mode: { type: string, enum: [user, device] }
                proof:
                  type: string
                  maxLength: 128
                  description: |
                    Standard padded base64 of the 64-byte signature that the agent key makes over
                    the registration transcript (the code's hash, the key's fingerprint, the mode
                    and the server key ID) under its own domain tag (`shared-crypto`'s
                    `registration` module)
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRegistration' }
        '400': { $ref: '#/components/responses/Problem' }
        '403':
          description: Refused. The same document for every reason
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429':
          description: Ten refusals were given in the last minute on this route; `Retry-After` is the time until the oldest is a minute old
          headers:
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 60 }, description: Seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/login:
    post:
      tags: [system]
      summary: Log a local user in (13.3, ADR-469)
      description: |
        Local deployment only. Checks a username and a password and, when they hold, starts an
        operator session: the answer sets the cookie `ngr_session` (`HttpOnly`,
        `SameSite=Strict`, `Path=/`, no `Max-Age`), which every operator route then takes. The
        session ends 8 hours after login or 30 minutes after its last use, whichever comes
        first, at a logout, when the operator is disabled or its password is set again, and when
        the server restarts. A token the request presents is never adopted, and a live session
        it presents is ended.

        The checks run in this order: the request guard (13.3), the method (**405**, with
        `Allow`), the Origin (**403** without one: the request must carry the pinned origin),
        the body (read within 5 seconds, **408**; at most 4 KiB, **413**), the shape (**400**:
        `Content-Type: application/json` and exactly the two string properties below), the
        lengths (**400**: a username of 1 to 256 bytes without control characters, a password
        of 1 to 1024 bytes), the limit (**429**), one database read (**503**, **500**), then the
        password (**401**).

        **429**: at most 10 attempts are admitted within a sliding minute; while 10 are recorded,
        every attempt is refused before any lookup, a right password included, and only a
        successful login gives its place back. A caller that keeps the limit full can deny
        logins for up to a minute at a time (ADR-469).

        **401** has one body, byte for byte, for an unknown username, an operator without a
        password, a disabled operator and a wrong password, and each costs the same password
        check. **500** also answers a stored password hash that cannot be read.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in; the answer sets `ngr_session` and is not cached
          headers:
            Set-Cookie: { schema: { type: string }, description: '`ngr_session=<43 base64url characters>; HttpOnly; SameSite=Strict; Path=/`' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: One body for an unknown username, an operator without a password, a disabled operator and a wrong password
          headers:
            WWW-Authenticate: { schema: { type: string }, description: '`Ngr-Session`' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429':
          description: 10 attempts are recorded in the last minute; `Retry-After` is the time until the oldest is a minute old
          headers:
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 60 }, description: Seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/logout:
    post:
      tags: [system]
      summary: End the operator session (13.3, ADR-469)
      description: |
        Ends every session whose well-formed `ngr_session` the request carries and clears the
        cookie. It answers **204** with or without a live session and reads no database, so it
        works for a disabled operator and while the database is down. The request must carry
        the pinned Origin (**403** without one) and an empty body (**400**; **413**, **408** as
        for login).
      security: []
      responses:
        '204':
          description: Logged out; the cookie is cleared
          headers:
            Set-Cookie: { schema: { type: string }, description: '`ngr_session=; Max-Age=0; Path=/; HttpOnly; SameSite=Strict`' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }

  /v1/me:
    get:
      tags: [system]
      summary: The operator of this session (13.3, ADR-469)
      description: |
        Answers the operator the session belongs to, with its name and roles read at this
        request. Like every operator route on the local deployment it needs a live session:
        without one, with a malformed or repeated `ngr_session`, after the session expired, or
        once the operator was disabled or its password set again, the answer is **401**, which
        clears a presented cookie. A database failure during the session check or the read is **503**
        (**500** for a fault of the query itself).
      security:
        - operatorSession: []
      responses:
        '200':
          description: The operator; not cached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '401':
          description: No live session; a presented `ngr_session` is cleared
          headers:
            WWW-Authenticate: { schema: { type: string }, description: '`Ngr-Session`' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '405':
          description: A method other than GET or HEAD
          headers:
            Allow: { schema: { type: string }, description: '`GET,HEAD`' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/agent/challenge:
    post:
      tags: [agents]
      summary: Get a connection challenge (6.4, 14.4, ADR-466)
      description: |
        The first step of an agent's proof that it holds its registered key. Needs no login: the
        agent has no session, and the request has no body to trust. The body must be empty
        (a non-empty body is **400**). The server answers with 32 random bytes that it keeps in
        memory for 60 seconds and removes at the first presentation, whatever the outcome. The
        store holds at most 1024 challenges and drops the oldest beyond that; the cap below keeps
        the live count far under it, so on one server none is dropped (ADR-467).

        Like registration the route has a 5 second body-read bound (**408**) and answers **405**
        with `Allow` to another method. It is subject to the Host and Origin rules of 13.3. A
        challenge says nothing about any agent, so the route has no refusal of its own and the
        limit on refusals does not apply to it. Issuing is limited on its own: at most 60
        challenges within a sliding minute on the route, then **429** with `Retry-After` (the
        time until the oldest of the 60 is a minute old). A request answered 429 is not
        recorded and issues nothing. A caller that uses the whole cap can deny challenges to
        honest agents for up to a minute (ADR-467).
      security: []
      responses:
        '200':
          description: A fresh challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionChallenge' }
        '400': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429':
          description: 60 challenges were issued in the last minute on this route; `Retry-After` is the time until the oldest is a minute old
          headers:
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 60 }, description: Seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /v1/agent/session:
    post:
      tags: [agents]
      summary: Exchange a signed challenge for a session token (6.4, 14.4, ADR-459, ADR-466)
      description: |
        The second step: the agent presents the challenge it got, a nonce it chose and its
        signature over the connection transcript (`shared-crypto`'s `proof` module: the
        protocol version, the audience, the agent ID, the challenge and the nonce, under the
        proof's domain tag). Needs no login. The audience is the server's own pinned origin
        (13.3): the server builds it itself and never reads one from the request.

        The checks run in this order: the request guard (13.3), the method (**405**, with
        `Allow`), the body (read within 5 seconds, **408**; at most 4 KiB, **413**), the shape
        (**400**, which uses up no challenge), the challenge (**401**), the agent's row
        (**503**, **500**), then the key and the proof (**403**, or **429**).

        **400** is decided on the shape of the request alone, before and without any lookup: a
        `Content-Type` other than `application/json` (parameters allowed), an `agentId` that is
        not a canonical lowercase UUID, a `challenge`, `nonce` or `proof` that is not standard
        padded base64 or does not decode to exactly 32, 32 and 64 bytes, a missing, unknown or
        duplicate field, a field that is not a string, bytes after the JSON value, or a body
        that is not a JSON object.

        **401** is for a challenge that is unknown, expired or already presented: the agent
        fetches a new one at once. The challenge is removed at this presentation whatever the
        outcome, so a refusal below uses it up too. A 401 is not counted by the refusal limiter
        and is never turned into a 429.

        **403** is the one uniform refusal for an unknown agent, a revoked row, a bad signature
        and a wrong audience. The caller cannot tell these apart; the reason goes to the
        server's log only, and the log is rate-bounded. Refusals are limited for the whole
        route as registration's are (ten 403 responses within the last minute, then **429**
        until the oldest is a minute old); only 403 counts, and a valid proof is never limited.
        A distinct answer for a revoked key waits for the work that authenticates the server to
        the agent, since the answer would be unauthenticated on the local profile.

        On success the server returns a token: 32 random bytes, of which it keeps only the
        SHA-256, valid for 300 seconds and reported as a relative time, since the device clock
        is untrusted (16.3). It is a bearer token that may be presented any number of times
        within that time. The agent sends it as `Authorization: Bearer <token>` on the upgrade of
        the control channel (`agentControl` in `api/asyncapi.yaml`), at `GET /api/v1/agent/control`
        with the subprotocol `ngr-control.v1`; a missing or expired token is answered 401 before
        any upgrade (with `WWW-Authenticate: Bearer`), and an upgrade without the subprotocol is
        answered 400. The agent takes a fresh exchange before every upgrade.

        **503** is returned when the database cannot be reached or a statement fails or times out
        (5 seconds); **500** for any other failure of the server, including a stored key that
        does not decode. Neither counts toward the limit, and the challenge stays used up. A
        stale or unknown challenge is answered 401 before the database is read, whatever else
        is wrong with the request.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agentId, challenge, nonce, proof]
              properties:
                agentId:
                  type: string
                  maxLength: 36
                  description: The ID registration assigned; a canonical lowercase UUID
                challenge:
                  type: string
                  maxLength: 64
                  description: Standard padded base64 of the 32 bytes that `/v1/agent/challenge` returned
                nonce:
                  type: string
                  maxLength: 64
                  description: Standard padded base64 of 32 random bytes the agent chose for this exchange
                proof:
                  type: string
                  maxLength: 128
                  description: |
                    Standard padded base64 of the 64-byte signature the agent key makes over the
                    transcript
      responses:
        '200':
          description: A session token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: The challenge is unknown, expired or was presented before. Fetch a new one
          headers:
            WWW-Authenticate: { schema: { type: string }, description: '`Bearer`' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Refused. The same document for every reason
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429':
          description: Ten refusals were given in the last minute on this route; `Retry-After` is the time until the oldest is a minute old
          headers:
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 60 }, description: Seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------ Artifacts and extensions
  /v1/artifacts:
    post:
      tags: [artifacts]
      summary: Ingest an ECU artifact (11.2)
      description: |
        Stored without altering the bytes and identified by hash. No re-signing or decryption is performed.
        If there is no manifest, target models etc. are accepted as a declaration.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                declaredTargets:
                  type: array
                  items: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }

  /v1/artifacts/{digest}/publish:
    post:
      tags: [artifacts]
      summary: Publish a version (staged rollout)
      parameters:
        - name: digest
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rolloutPercent: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '204': { description: Published }

  /v1/extensions:
    post:
      tags: [extensions]
      summary: Ingest an extension package (9.4)
      description: |
        After validation, re-signed with the operator's distribution key (ingestion signature. 11.1).
        IR, screen/report definitions, record templates, message text, unit systems.
        VCI profiles are not ingested here; they are installed on devices outside this software (9.3).
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extension' }
        '422':
          description: Contains elements outside the supported subset (8.3). Returns a list of the offending locations
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------ Acquired data
  /v1/datasets/{datasetId}:
    get:
      tags: [data]
      summary: Return metadata for acquired data (4.5)
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dataset' }

  /v1/datasets/{datasetId}/series:
    get:
      tags: [data]
      summary: Read a time series at a specified resolution
      description: |
        Dedicated API that hides the storage format. Changing the implementation does not affect consumers.
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: fields
          in: query
          schema: { type: array, items: { type: integer } }
        - name: resolution
          in: query
          description: Number of points matching the screen width. Downsamples using min/max values
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesPage' }

  /v1/datasets/{datasetId}/annotations:
    post:
      tags: [data]
      summary: Add an annotation
      description: Values acquired from the vehicle cannot be edited. Annotations are separate records (4.3).
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Annotation' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Annotation' }

  /v1/datasets/{datasetId}/records:
    put:
      tags: [data]
      summary: Update a work record (3-way merge)
      description: |
        Detects conflicts using `baseVersion` and per-item versions (4.4).
        Auto-filled values (from the vehicle) cannot be edited.
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordUpdate' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordUpdate' }
        '409':
          description: Conflict. Returns the server's latest version and the base version
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/changes:
    get:
      tags: [data]
      summary: Change feed (4.4)
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes: { type: array, items: { type: object } }
                  nextCursor: { type: string }

  # ------------------------------------------------------------ SOVD
  /v1/sovd/components:
    get:
      tags: [sovd]
      summary: Component hierarchy (VCI → vehicle → ECU)
      responses:
        '200':
          content:
            application/json:
              schema: { type: object }

  /v1/sovd/components/{componentId}/data:
    get:
      tags: [sovd]
      description: Derived from IR data objects. Use WebSocket for 10ms-interval subscriptions
      parameters: [{ $ref: '#/components/parameters/ComponentId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

  /v1/sovd/components/{componentId}/faults:
    get:
      tags: [sovd]
      description: DTCs. Read-only; annotations only
      parameters: [{ $ref: '#/components/parameters/ComponentId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

  /v1/sovd/components/{componentId}/operations:
    get:
      tags: [sovd]
      parameters: [{ $ref: '#/components/parameters/ComponentId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

  /v1/sovd/components/{componentId}/updates:
    get:
      tags: [sovd]
      description: ECU reprogramming. Execution is mapped onto the job model
      parameters: [{ $ref: '#/components/parameters/ComponentId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    operatorSession:
      type: apiKey
      in: cookie
      name: ngr_session
      description: |
        The local deployment's operator session (13.3, ADR-469), set by `POST /v1/login`. A
        request whose method is not GET or HEAD must also carry the pinned Origin, or it is
        **403** before the cookie is read.

  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string }
    ComponentId:
      name: componentId
      in: path
      required: true
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, description: 'The operator''s username; 1 to 256 bytes, no control characters, compared exactly' }
        password: { type: string, minLength: 1, description: 'At most 1024 bytes' }
    Operator:
      type: object
      additionalProperties: false
      required: [operatorId, username, displayName, roles]
      properties:
        operatorId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string, enum: [viewer, worker, reprogrammer, remote, approver, admin] }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    Problem:
      type: object
      description: RFC 9457. `code` holds a machine-readable value
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum:
            - DEVICE_LOCKED
            - VEHICLE_LOCKED
            - VIN_MISMATCH
            - VARIANT_MISMATCH
            - POWER_CONDITION
            - SIGNATURE_INVALID
            - UNSUPPORTED_ABI
            - GATEWAY_AUTH_REQUIRED
            - SEED_KEY_REQUIRED
            - AGENT_TOO_OLD
            - UNSUPPORTED_IR_SCHEMA
            - SUBSET_VIOLATION
            - CONFLICT

    JobRequest:
      type: object
      required: [kind, agentId, vciId]
      properties:
        kind:
          type: string
          enum: [acquire, monitorSession, monitorCapture, runSequence, writeSettings, reprogram, identify]
        agentId: { type: string }
        vciId: { type: string }
        vin: { type: string }
        irDigests:
          type: array
          items: { type: string }
          description: |
            SHA-256 of each IR document of the job. The server writes them, sorted and without
            duplicates, into the signed instruction's `document_hashes` (ADR-454, ADR-461); an
            identification job names its documents through the plan instead.
        artifactDigest: { type: string, description: Written into the signed instruction's `artifact_hash` }
        parameters:
          type: object
          additionalProperties: true
        startDeadline: { type: string, format: date-time }
        executionWindow:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        remote: { type: boolean, description: Remote execution (requires the remote operator role and permission on the agent side)
        }
        onSiteContact: { type: string, description: Required for remote reprogramming }

    Job:
      type: object
      properties:
        jobId: { type: string }
        kind: { type: string }
        state:
          type: string
          enum:
            [received, precheck, ready, running, verifying, awaitingHmi,
             cancelRequested, completed, failed, cancelled, expired,
             preconditionFailed, needsOnSiteRecovery]
        progressPermille: { type: integer }
        confirmation:
          type: object
          properties:
            level: { type: string, enum: [notifyOnly, gracePeriod, onSiteApproval, twoPerson] }
            approvedAt: { type: string, format: date-time }
            approvedBy: { type: string }
        datasetId: { type: string }
        lastSeenAt: { type: string, format: date-time, description: Treated as running while disconnected }

    OfflinePackage:
      type: object
      properties:
        signedJob: { type: string, description: base64 of the same signed instruction envelope as the control channel's job command (11.1, ADR-461) }
        offlineToken: { type: string }
        expiresAt: { type: string, format: date-time, description: Informational only. The agent judges expiry by the signed instruction's start deadline }
        artifacts: { type: array, items: { type: string } }

    Agent:
      type: object
      properties:
        agentId: { type: string }
        displayName: { type: string }
        online: { type: boolean }
        mode: { type: string, enum: [user, device] }
        allowRemote: { type: boolean }
        preset: { type: string, enum: [personal, personalRemote, shared] }
        capabilities: { $ref: '#/components/schemas/Capabilities' }

    ConnectionChallenge:
      type: object
      description: A single-use challenge for one proof exchange (ADR-466). The agent reads it strictly (ADR-471).
      additionalProperties: false
      required: [challenge]
      properties:
        challenge: { type: string, description: Standard padded base64 of 32 random bytes; valid for 60 seconds and for one presentation }

    AgentSession:
      type: object
      description: |
        A session token for the control channel (ADR-466). It is a bearer token: whoever holds
        it can open the channel as the agent until it expires.
      additionalProperties: false
      required: [token, expiresInSecs]
      properties:
        token: { type: string, description: Standard padded base64 of 32 random bytes }
        expiresInSecs: { type: integer, minimum: 1, description: Seconds the token stays valid, counted from the answer (300) }

    AgentRegistration:
      type: object
      description: |
        What registration returns (ADR-463). The agent stores it as its registration record after
        it has checked that the instruction key's fingerprint equals the server key ID the operator
        gave it and that `signature` verifies. `capabilities` are not part of registration: the agent reports them after it
        connects (9.5). The agent reads it strictly: a property not listed here makes the answer
        unusable (ADR-470).
      additionalProperties: false
      required: [agentId, ownerId, preset, allowRemote, instructionKey, instructionKeyId, signature]
      properties:
        agentId: { type: string, description: Assigned by the server; a canonical lowercase UUID }
        ownerId: { type: string, description: The operator ID the code named at issuance (6.6) }
        preset: { type: string, enum: [personal, personalRemote, shared], description: Always `personal` in M3 (6.7) }
        allowRemote: { type: boolean }
        instructionKey: { type: string, description: The server's job instruction key as an SPKI PEM document (11.1) }
        instructionKeyId: { type: string, description: The SHA-256 of the key's SPKI document, 64 lowercase hex digits }
        signature:
          type: string
          description: |
            Standard padded base64 of the 64-byte signature that the instruction key makes over the
            response transcript (the code's hash, the agent key's fingerprint, `agentId`, `ownerId`,
            `preset` and `allowRemote`) under its own domain tag (`shared-crypto`'s `registration`
            module). The agent verifies it against `instructionKey`, after comparing that key's
            fingerprint with the server key ID, and stores nothing when it fails

    Capabilities:
      type: object
      description: 9.5. The server uses this to decide whether delivery is possible
      properties:
        agentVersion: { type: string }
        protocolVersion: { type: integer }
        platform:
          type: object
          properties:
            os: { type: string }
            nativeArch: { type: string }
            emulated: { type: boolean }
            mode: { type: string }
        workers:
          type: array
          items:
            type: object
            properties:
              abi: { type: string }
              available: { type: boolean }
              reason: { type: string }
        vcis:
          type: array
          items:
            type: object
            properties:
              vciId: { type: string }
              name: { type: string }
              vendor: { type: string }
              standard: { type: string }
              abiInterpretation: { type: string, enum: [standard, productDefined, inferred] }
              loadable: { type: boolean }
              reason: { type: string }
              signatureVerifier: { type: string, enum: [library, adapter, ecuOnly] }
        irSchemaVersions: { type: array, items: { type: integer } }
        extensionSchemaVersions: { type: array, items: { type: integer } }
        monitorDirect: { type: boolean }
        offlineCapable: { type: boolean }

    Artifact:
      type: object
      properties:
        digest: { type: string }
        size: { type: integer }
        declaredTargets: { type: array, items: { type: string } }
        manifestParsed: { type: boolean }
        signatureVerifier: { type: string, enum: [library, adapter, ecuOnly] }
        publishedAt: { type: string, format: date-time }

    Extension:
      type: object
      properties:
        id: { type: string, description: Reverse-domain format }
        version: { type: string }
        kind:
          type: string
          enum: [ir, screen, recordTemplate, message, unit]
        schemaVersion: { type: integer }
        license:
          type: object
          properties:
            origin: { type: string }
            scope: { type: string, enum: [tenantOnly, redistributable] }
        signedAt: { type: string, format: date-time }

    Dataset:
      type: object
      properties:
        datasetId: { type: string }
        jobId: { type: string }
        vin: { type: string }
        ecu:
          type: object
          properties:
            address: { type: string }
            partNumber: { type: string }
            swVersion: { type: string }
        vci:
          type: object
          properties:
            model: { type: string }
            serial: { type: string }
        versions:
          type: object
          properties:
            library: { type: string }
            ir: { type: string }
            agent: { type: string }
        clockOffsetMillis: { type: integer }
        capturedFromMonitor:
          type: object
          description: Only for capture (4.6)
          properties:
            route: { type: string, enum: [direct, relay] }
            measuredIntervalMillis: { type: integer }
            framesDropped: { type: integer }

    SeriesPage:
      type: object
      properties:
        fields: { type: array, items: { type: integer } }
        points:
          type: array
          description: With a resolution specified, [t, min, max] tuples
          items: { type: array, items: { type: number } }
        nextCursor: { type: string }

    Annotation:
      type: object
      properties:
        annotationId: { type: string }
        target: { type: string, description: DTC code or time range etc. }
        text: { type: string }
        verdict: { type: string, enum: [ok, needsCheck, ng] }
        author: { type: string }
        createdAt: { type: string, format: date-time }

    RecordUpdate:
      type: object
      description: Work record based on a record template (4.3.1)
      properties:
        templateId: { type: string }
        baseVersion: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string }
              value: {}
              version: { type: integer }
              origin: { type: string, enum: [manual, autoFilled] }
              reason: { type: string, description: Required when correcting }
