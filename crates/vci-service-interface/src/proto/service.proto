// Bit masks for each PDU_FLAG_DATA context.
// Enum values encode a bit *position* inside the PDU_FLAG_DATA byte array.
// Value 0 is reserved (UNSPECIFIED).  For every other value v:
//   byte index  = (v - 1) / 8
//   bit in byte = (v - 1) % 8
// So value 1 -> byte[0] bit 0 (0x01), value 2 -> byte[0] bit 1 (0x02), ...
//    value 9 -> byte[1] bit 0, etc.
// The service accumulates all selected bit positions into a little-endian byte
// array. Callers can use named bits for Tx/Cll flags or raw byte passthrough
// where provided by the corresponding request message.

// Bit positions for PDU_COP_CTRL_DATA.TxFlag.
// Specific bits are protocol/VCI-defined; use the raw field for custom masks.
enum TxFlagBit {
    TX_FLAG_BIT_UNSPECIFIED = 0;
    // ISO 22900-2:2022 D.2.1 / Table D.4
    // byte[0] bit 6: ISO 15765-3 / ISO 14229-3 suppress positive response.
    TX_FLAG_SUPPRESS_POS_RESP = 7;
    // byte[0] bit 5: include header/footer extra info in result item.
    TX_FLAG_ENABLE_EXTRA_INFO = 6;
    // byte[2] bit 1 (RAW_MODE only): reduce wait to P3_MIN after physical response.
    TX_FLAG_WAIT_P3_MIN_ONLY = 18;
    // byte[2] bit 0 (RAW_MODE only): CAN ID type in PDU data (0=11-bit, 1=29-bit).
    TX_FLAG_CAN_29BIT_ID = 17;
    // byte[3] bit 7 (RAW_MODE only): ISO 15765 extended addressing indicator.
    TX_FLAG_ISO15765_ADDR_TYPE = 32;
    // byte[3] bit 6 (RAW_MODE only): ISO 15765 frame padding indicator.
    TX_FLAG_ISO15765_FRAME_PAD = 31;
}

// Bit positions for the pCllCreateFlag argument of PDUCreateComLogicalLink.
enum CllCreateFlagBit {
    CLL_CREATE_FLAG_BIT_UNSPECIFIED = 0;
    // ISO 22900-2:2022 D.2.3 / Table D.6
    // byte[0] bit 6: ChecksumMode (for checksum-capable protocols).
    CLL_CREATE_FLAG_CHECKSUM_MODE = 7;
    // byte[0] bit 7: RawMode (pass-through message with header/footer/checksum bytes).
    CLL_CREATE_FLAG_RAW_MODE = 8;
}

