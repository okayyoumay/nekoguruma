    oneof handle {
        ModuleHandle module_handle = 1;
        ComLogicalLinkHandle cll_handle = 2;
        ComPrimitiveHandle cop_handle = 3;
    }
}

message GetResourceStatusRequest {
    repeated ModuleAndResourceId resources = 1;
}

message CreateComLogicalLinkRequest {
    ModuleHandle module_handle = 1;
    oneof resource {
        ResourceData rsc_data = 2;
        uint32 resource_id = 3;
        string resource_name = 4;
    }
    // ADR-204: removed. `pCllTag` correlation has no client-visible echo
    // path (no gRPC event message ever carried it) and no CLL-scoped
    // correlation race exists to justify adding one -- `cll_handle` is
    // always already known to the caller before any CLL-scoped event can
    // occur. Tag 5 and the field name stay reserved.
    reserved 5;
    reserved "cll_tag";
    // Creation flag passed through to pCllCreateFlag.
    // Set exactly one representation: named bits or raw bytes.
    oneof cll_create_flag {
        CllCreateFlag cll_create_flag_bits = 6;
        bytes cll_create_flag_raw = 7;
    }
}

message DestroyComLogicalLinkRequest {
    ComLogicalLinkHandle cll_handle = 1;
}

