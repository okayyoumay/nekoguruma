[package]
name = "server"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "ngr-server"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ngr-server"
path = "src/main.rs"

# A stand-in for the object server (RustFS), which the tests start where they need a child that
# misbehaves on demand (ADR-491). It serves TLS through the test server of `ngr-pinned-tls`, so it
# is built only with the `fake-object-server` feature, which the package's own dev-dependency turns
# on for its tests (below): it is absent from an installation and from a release build.
[[bin]]
name = "ngr-fake-object-server"
path = "src/bin/ngr-fake-object-server.rs"
test = false
doc = false
required-features = ["fake-object-server"]

[features]
# Builds the fake object server (the binary above) and the test TLS server it needs. For tests.
fake-object-server = ["ngr-pinned-tls/test-server"]

[dependencies]
shared-proto.workspace = true
shared-crypto.workspace = true
# The key and certificate of the bundled object server and the pin of its certificate (ADR-505).
ngr-pinned-tls = { workspace = true, features = ["identity"] }
diag-ir.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
# Argon2id for the local users' passwords (ADR-469). The PHC string format and the random salt
# come with `password-hash`; `alloc` is for the string output.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
# Reads a request body frame by frame, so the registration route can bound its size and time.
http-body-util = "0.1"
# The server serves HTTP/1 only (ADR-456), so it drives hyper directly instead of `axum::serve`,
# which also accepts HTTP/2 whenever another crate in the build turns that feature on.
# The `client` feature is for the object store's requests to the bundled object server: one HTTP/1
# connection per request, driven directly (ADR-492), so no pool and no HTTP/2.
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", default-features = false }
# Builds and signs the requests to the object server (SigV4 presigned URLs) and parses its XML
# answers, without a client of its own (ADR-492). Only the RustCrypto signing and the XML actions:
# no base64, MD5 or JSON parts, and no aws-lc.
rusty-s3 = { version = "0.11", default-features = false, features = ["rustcrypto", "xml"] }
# The timestamp type of rusty-s3's `signing::sign`, which the hand-written ListMultipartUploads
# request calls directly. The version rusty-s3 itself uses, so the build holds one copy.
jiff = { version = "0.2", default-features = false, features = ["std"] }
# The XML reader of rusty-s3, used for the ListMultipartUploads answer, which rusty-s3 has no
# action for (ADR-492). The version rusty-s3 uses.
instant-xml = "0.7"
# Only its error types: the control channel tells a message over the limit from other read errors
# by the stack's own error (ADR-468). It must stay the version axum's WebSocket uses.
tungstenite = { version = "0.29", default-features = false }

# Unix only: the open flags and the effective user ID that the key file's checks use, and the
# signal and parent-death calls of the object server child (ADR-491).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows only: the kill-on-close job object that holds the object server child (ADR-491).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_norway.workspace = true
tempfile = "3"
getrandom.workspace = true
# The session route's test moves tokio's clock (ADR-467); no other test needs it.
tokio = { workspace = true, features = ["test-util"] }
# The control channel's tests are its client (ADR-468): the handshake over a stream the test opens.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# The package itself, with the fake object server and the test TLS server on, so that the tests
# build the fake and their own TLS peers need no TLS crate of their own (ADR-505).
server = { path = ".", features = ["fake-object-server"] }
# tests/postgres/job_end_to_end.rs builds the job documents of the fictional vehicle and of a
# read-only acquisition, installs the worker and the simulator's definition for the real agent it
# starts, and reads the simulated ECU's state file afterwards.
diag-frontend = { path = "../diag-frontend" }
j2534-0404-mock = { workspace = true }
postcard = { workspace = true }
sim-ecu = { workspace = true }
worker-host = { workspace = true }

[lints]
workspace = true
