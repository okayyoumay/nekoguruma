# Weekly version updates for the Cargo workspace and the GitHub Actions in .github/workflows.
# Cargo minor and patch updates arrive as one grouped pull request, and each major Cargo update
# gets its own, since it can change behaviour. All GitHub Actions updates, majors included, arrive
# as one grouped pull request. A new release is proposed only after it has been out for a week
# (cooldown), so a compromised or yanked release has time to surface.
# The cargo-minor-patch group's pull request is auto-merged once the required checks pass
# (.github/workflows/dependabot-auto-merge.yml); every other update waits for the maintainer.
# Security updates are separate: they follow the repository's Dependabot alert settings and
# ignore the schedule, grouping and cooldown below.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # libloading 0.9 changed Library::new's path bound, and the loader code bindgen generates
      # into the committed -sys bindings does not compile against it yet. Remove once the
      # bindings are regenerated with a bindgen release that supports 0.9.
      - dependency-name: libloading
        versions: [">=0.9"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [major, minor, patch]
