# Fuzz targets for malformed IR (design 12.1), run with cargo-fuzz on a nightly toolchain
# (`fuzz/README.md`). The package is its own workspace, so the main workspace's builds and
# checks leave it out.
[package]
name = "ngr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
diag-ir = { path = "../crates/diag-ir" }
libfuzzer-sys = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }

[workspace]
members = ["seeds"]

[[bin]]
name = "ngr-fuzz-ecu-document"
path = "fuzz_targets/ngr-fuzz-ecu-document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ngr-fuzz-vm"
path = "fuzz_targets/ngr-fuzz-vm.rs"
test = false
doc = false
bench = false
