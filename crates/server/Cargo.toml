[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ngr-server"
path = "src/main.rs"

[dependencies]
shared-proto.workspace = true
shared-crypto.workspace = true
diag-ir.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
# Argon2id for the local users' passwords (ADR-469). The PHC string format and the random salt
# come with `password-hash`; `alloc` is for the string output.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
# Reads a request body frame by frame, so the registration route can bound its size and time.
http-body-util = "0.1"
# The server serves HTTP/1 only (ADR-456), so it drives hyper directly instead of `axum::serve`,
# which also accepts HTTP/2 whenever another crate in the build turns that feature on.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", default-features = false }
# Only its error types: the control channel tells a message over the limit from other read errors
# by the stack's own error (ADR-468). It must stay the version axum's WebSocket uses.
tungstenite = { version = "0.29", default-features = false }

# Unix only: the open flags and the effective user ID that the key file's checks use.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
getrandom.workspace = true
# The session route's test moves tokio's clock (ADR-467); no other test needs it.
tokio = { workspace = true, features = ["test-util"] }
# The control channel's tests are its client (ADR-468): the handshake over a stream the test opens.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
