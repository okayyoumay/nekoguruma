}

message GetComParamRequest {
    ComLogicalLinkHandle cll_handle = 1;
    oneof param {
        uint32 param_id = 2;
        string param_name = 3;
    }
}

message SetComParamRequest {
    ComLogicalLinkHandle cll_handle = 1;
    ParamItem param_item = 2;
}

message StartComPrimitiveRequest {
    ComLogicalLinkHandle cll_handle = 1;
    ComOperationType cop_type = 2;
    bytes cop_data = 3;
    ComPrimitiveCtrlData cop_ctrl_data = 4;
    // ADR-204: opaque, server-never-interprets client correlation token.
    // Echoed verbatim on every EventItem.cop_tag emitted for the resulting
    // COP (iff cop_handle is present on that event), regardless of backend.
    // Never forwarded to the native pCoPTag on iso22900-service -- the
    // authoritative echo source is service-side per-COP state on every
    // backend, uniformly. Subject to a documented maximum size, enforced
    // here with INVALID_ARGUMENT (see docs/rpc-api-guide.md).
    optional bytes cop_tag = 5;
}

message CancelComPrimitiveRequest {
    ComPrimitiveHandle cop_handle = 1;
}

message GetEventItemRequest {
    oneof handle {
        SystemHandle system_handle = 1;
        ModuleHandle module_handle = 2;
        ComLogicalLinkHandle cll_handle = 3;
    }
}

// Request for SubscribeEvent streaming RPC.
// When the server-side callback fires, it drains all pending event items via
// GetEventItem and streams them back to the caller.
message SubscribeEventRequest {
    oneof handle {
        SystemHandle system_handle = 1;
        ModuleHandle module_handle = 2;
        ComLogicalLinkHandle cll_handle = 3;
    }
}

// A single streamed message from SubscribeEvent.
// callback_event_type reflects the T_EVT_DATA value passed to the
// registered callback; event_item carries each item read out via
// GetEventItem (there may be more than one per callback invocation).
message EventNotification {
    oneof handle {
        SystemHandle system_handle = 1;
        ModuleHandle module_handle = 2;
        ComLogicalLinkHandle cll_handle = 3;
    }
    oneof event_data {
        LostEventItemNotification lost = 4;
        EventItem item = 5;
    }
}

message GetObjectIdRequest {
    ObjectType object_type = 1;
    string shortname = 2;
}

message GetModuleIdsRequest {
}

message GetResourceIdsRequest {
    ModuleHandle module_handle = 1;
    ResourceData resource_data = 2;
}

message GetConflictingResourcesRequest {
    oneof resource {
        uint32 resource_id = 1;
        string resource_name = 2;
    }
    ModuleItem input_module_list = 3;
}

message GetUniqueRespIdTableRequest {
    ComLogicalLinkHandle cll_handle = 1;
}

message SetUniqueRespIdTableRequest {
    ComLogicalLinkHandle cll_handle = 1;
    UniqueRespIdTableItem unique_resp_id_table = 2;
}

message ModuleConnectRequest {
    ModuleHandle module_handle = 1;
}

message ModuleDisconnectRequest {
    optional ModuleHandle module_handle = 1;
}

message GetTimestampRequest {
    ModuleHandle module_handle = 1;
}

// ============================================================================
// GRPC SERVICE DEFINITION
// ============================================================================

service VciService {
    
    // Module Management
    rpc GetModuleIds(GetModuleIdsRequest) returns (ModuleIdsResponse);
    rpc ModuleConnect(ModuleConnectRequest) returns (Response);
    rpc ModuleDisconnect(ModuleDisconnectRequest) returns (Response);
    
    // Version and Information
    rpc GetVersion(GetVersionRequest) returns (VersionResponse);
    rpc GetTimestamp(GetTimestampRequest) returns (TimestampResponse);
    
    // Resource Management
    rpc GetResourceStatus(GetResourceStatusRequest) returns (ResourceStatusResponse);
    rpc GetResourceIds(GetResourceIdsRequest) returns (ResourceIdsResponse);
    rpc GetConflictingResources(GetConflictingResourcesRequest) returns (ConflictingResourcesResponse);
    
    // Logical Link Management
    rpc CreateComLogicalLink(CreateComLogicalLinkRequest) returns (ComLogicalLinkResponse);
    rpc DestroyComLogicalLink(DestroyComLogicalLinkRequest) returns (Response);
    rpc ConnectComLogicalLink(ConnectComLogicalLinkRequest) returns (Response);
    rpc DisconnectComLogicalLink(DisconnectComLogicalLinkRequest) returns (Response);
    
    // Resource Locking
    rpc LockResource(LockResourceRequest) returns (Response);
    rpc UnlockResource(UnlockResourceRequest) returns (Response);
    
    // Communication Parameters
    rpc GetComParam(GetComParamRequest) returns (ComParamResponse);
    rpc SetComParam(SetComParamRequest) returns (Response);
    
    // Communication Primitives
    rpc StartComPrimitive(StartComPrimitiveRequest) returns (ComPrimitiveResponse);
    rpc CancelComPrimitive(CancelComPrimitiveRequest) returns (Response);
    
    // Status and Events
    rpc GetStatus(GetStatusRequest) returns (StatusResponse);
    rpc GetEventItem(GetEventItemRequest) returns (EventItemResponse);
    // Server-streaming RPC that registers a callback internally and streams
    // all EventItems drained from the queue back to the caller.  The stream
    // stays open until the client cancels or the logical link is destroyed.
    rpc SubscribeEvent(SubscribeEventRequest) returns (stream EventNotification);
    
    // IO Control
    rpc IoCtl(IoCtlRequest) returns (IoCtlResponse);
    
    // Object Management
    rpc GetObjectId(GetObjectIdRequest) returns (ObjectIdResponse);
    
    // Unique Response ID Table
    rpc GetUniqueRespIdTable(GetUniqueRespIdTableRequest) returns (UniqueRespIdTableResponse);
    rpc SetUniqueRespIdTable(SetUniqueRespIdTableRequest) returns (Response);
}
