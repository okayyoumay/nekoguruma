openapi: 3.1.0
info:
  title: Vehicle Diagnostic System API
  version: 0.1.0
  description: |
    Corresponds to the design document system-architecture.md.

    Separates the SOVD-compliant part from proprietary extensions (8.7).
    - `/v1/sovd/**` : Compliant with the SOVD resource model
    - `/v1/**`      : Specific to this system (jobs, agents, artifacts, extensions)

    Authentication is OIDC (Bearer) on the standard deployment, which is consistent with SOVD
    assuming OAuth2. The local deployment authenticates local users instead (13, 13.3,
    ADR-469): `POST /v1/login` sets the `ngr_session` cookie, and every operator route takes
    that cookie in place of a bearer token.

    An operation the server does not implement yet carries `x-ngr-status: planned`; every
    other operation is served. A test checks this against the routes the server mounts
    (`api/README.md`).

servers:
  - url: https://example.com/api
    description: Standard deployment
  - url: http://127.0.0.1:8080/api
    description: Local deployment (chapter 13)

security:
  - bearerAuth: []
  - operatorSession: []

tags:
  - name: jobs
  - name: agents
  - name: artifacts
  - name: extensions
  - name: data
  - name: sovd
  - name: system

paths:
  # ------------------------------------------------------------ System
  /v1/health:
    get:
      tags: [system]
      summary: Liveness and readiness probe
      description: |
        Needs no login: the installer, the service manager and tests probe it before any user
        exists. The server runs `SELECT 1` on its database: 200 when it answers within 2 seconds,
        otherwise 503 as a problem document with no detail. The body holds nothing else, since
        other OS users can reach it (13.3). Like every route of the local deployment it is
        subject to the Host and Origin rules of 13.3.
      security: []
      responses:
        '200':
          description: The server is serving and its database answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: The database does not answer within 2 seconds, or answers with an error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------ Jobs
  /v1/jobs:
    post:
      tags: [jobs]
      summary: Create a job (5.1, ADR-477)
      description: |
        Creates a job on the server, which makes its ID (UUIDv7) and answers **202**. The server
        checks that the caller holds the role `worker` with no scope, that the agent belongs to the
        caller's tenant, is not revoked and lists the caller among its allowed operators (6.8), and
        that its own instruction key is the active one; then it signs the job instruction (one
        envelope of a key fingerprint, a signature and a postcard payload that names the job's
        documents by hash, 11.1, ADR-461), stores it with the job and leaves its delivery to the
        queue (5.3, ADR-476). The job's start deadline is the request's `startDeadline` or, when it
        names none, 15 minutes after the instruction is issued (ADR-487). A `writeSettings` job's `gracePeriod` confirmation level is recorded and not
        enforced. Operations requiring seed-key or OEM authentication must be online (5.7).

        The local deployment accepts `kind` `acquire` and `writeSettings` only. Other kinds, a
        `remote` of `true`, a non-empty `parameters`, an `executionWindow` and an
        `onSiteContact` are **400**; `remote: false` and an empty `parameters` count as absent.
        `irDigests` is required (1 to 128 entries of 64 lowercase hex digits, in any order, repeats
        allowed). `agentId` is a lowercase UUID, `vciId` 1 to 1024 bytes of UTF-8 without a
        control character, and `vin`, when given, a well-formed VIN. `startDeadline`, when given,
        is an RFC 3339 date-time string with upper-case `T` and `Z`, a zone (`Z` or an offset of at
        most 15:59) and at most nine fractional digits; one that does not parse is **400**. The
        body is one JSON object of the
        names below, each at most once and none null, in at most 16384 bytes.

        `Idempotency-Key` (1 to 128 visible ASCII characters, compared as bytes) names the job for
        the client and is kept as long as the job. The same operator repeating the same request
        gets **202** with the stored job and its current state, whatever the caller's permission
        has become. Any other request that uses the key is **422** with no data of the job, also
        for a job another operator created. A request whose key no job uses is permission-checked
        before anything is written.

        A job that gives a `vin` takes the server's lock on that vehicle in the same transaction
        (8.8, ADR-480): while another job of the tenant holds it, the request is **409** with the
        `code` `VEHICLE_LOCKED`, nothing is created and the key stays free. The lock expires on
        its own, 10 minutes (`acquire`) or 30 minutes (`writeSettings`) after the job's start
        deadline. The server deletes it when the job ends: when it ends the job itself (an agent's
        rejection, a retired instruction key, an instruction too large to send, a job past its start
        deadline) and when the agent
        reports an end (5.6, ADR-481). A replay never takes a lock, and a job with no `vin`
        takes none. The answer names no holder, expiry or VIN, and there is no override.

        **Start deadline** (5.3, ADR-487). The server normalizes `startDeadline` to UTC whole
        seconds (a fraction is floored) and signs and stores that second. It must lie 60 to 86400
        seconds after the job's issue time (the server's clock when it reads the permission), both
        included; otherwise the request is **422** with the `code` `START_DEADLINE_OUT_OF_BOUNDS`,
        judged after the permission (**403**) and before the instruction key (**503**), with nothing
        created and the key still free. The deadline is part of the request: another deadline, or
        the field added or dropped, under a used key is the key's **422**, and the same deadline
        replays the stored job without the bounds being judged again.

        **Named objects** (8.2.6, ADR-501). Each `irDigests` entry must be an IR document the
        caller's tenant has stored (`PUT /v1/documents/{sha256}`), and `artifactDigest`, when
        given, an artifact the tenant holds; otherwise the request is **422** with the `code`
        `DOCUMENT_NOT_STORED` or `ARTIFACT_NOT_STORED` (the documents are judged first), judged
        after the start deadline's bounds and before the instruction key (**503**), with nothing
        created and the key still free. A replay is answered before this check.

        A job still `received` when
        its deadline has been reached is ended by the server (within one 30-second period) as `expired` and its vehicle lock is
        deleted; the replay of its creation then shows the state `expired` and no `failure`.

        Like every operator route the request needs a live session and, as a POST, the pinned
        Origin (**403**) before the cookie is read (**401**). The body is read within 5 seconds
        (**408**); a body over the limit is **413**; each of them closes the connection.
        An unreadable or invalid request is **400**. A database failure, a lock wait over 5 seconds
        or an instruction key that is not the active one is **503**; a fault of the server's own,
        such as a failing signer, is **500**.
      security:
        - operatorSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
      responses:
        '202':
          description: Accepted (delivery is asynchronous); not cached. A replay answers the stored job with its current state
          headers:
            Cache-Control: { schema: { type: string }, description: '`no-store`' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400':
          description: The Content-Type, the idempotency key, the body or a value is invalid, or the request asks for something the server does not support
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No live session; a presented `ngr_session` is cleared
          headers:
            WWW-Authenticate: { schema: { type: string }, description: '`Ngr-Session`' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The Origin is not the pinned one, or the caller may not create this job (one document for every reason)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408':
          description: The body did not arrive within 5 seconds; the connection is closed
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: The body is over 16384 bytes; the connection is closed
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Another job holds the lock of this vehicle (`code` `VEHICLE_LOCKED`); nothing was created and the idempotency key is not used
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The idempotency key belongs to another request or operator (the answer holds no data of the job), or `startDeadline` is not 60 to 86400 seconds after the issue time (`code` `START_DEADLINE_OUT_OF_BOUNDS`), or a named IR document or the named artifact is not stored for the tenant (`code` `DOCUMENT_NOT_STORED` or `ARTIFACT_NOT_STORED`); nothing was created and the idempotency key is not used
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/jobs/{jobId}:
    get:
      x-ngr-status: planned
      tags: [jobs]
      summary: Get job status
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }

  /v1/jobs/{jobId}/cancel:
    post:
      x-ngr-status: planned
      tags: [jobs]
      summary: Request cancellation
      description: |
        Does not take effect immediately. In an uninterruptible section (8.10.1) the request is held,
        and the job transitions to cancelled once it reaches an interruptible point.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202': { description: Cancellation request accepted }

  /v1/jobs/{jobId}/hmi/{requestId}:
    post:
      x-ngr-status: planned
      tags: [jobs]
      summary: Respond to an HMI request (8.6)
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204': { description: Accepted }

  /v1/jobs/{jobId}/offline-package:
    get:
      x-ngr-status: planned
      tags: [jobs]
      summary: Get the offline job package (5.7)
      description: |
        Returns the signed job instruction, references to ECU artifacts, the IR documents, and an offline token
        together. The expiry is short: the agent judges it by the signed instruction's start deadline (5.3, 11.1).
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfflinePackage' }
        '409':
          description: Cannot start offline (seed-key or OEM authentication required)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------ Agents
  /v1/agents:
    get:
      x-ngr-status: planned
      tags: [agents]
      summary: List operable agents
      description: Returns only agents whose allowed-user list includes the caller (6.6).
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }

  /v1/agents/{agentId}:
    get:
      x-ngr-status: planned
      tags: [agents]
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }

  /v1/agents/{agentId}/revoke:
    post:
      x-ngr-status: planned
      tags: [agents]
      summary: Revoke an agent key (16.3)
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '204': { description: Revoked }

  /v1/agents/register:
    post:
      tags: [agents]
      summary: Register an agent with a registration code (6.4, 6.7, ADR-463)
      description: |
        Needs no login: the agent has no session. What authorizes the request is a single-use
        registration code that an administrator issued with the server's `registration-code`
        command, bound to the agent key's fingerprint and to an owner. The device authorization
        flow is not offered.

        The checks run in this order: the request guard (13.3), the method (**405**, with `Allow`),
        the body (read within 5 seconds, **408**; at most 4 KiB, **413**), the shape (**400**),
        the proof, then the database.

        **400** is decided on the shape of the request alone, before and without any database
        lookup: a `Content-Type` other than `application/json` (parameters allowed; it is 400,
        not 415), a code whose prefix, length or alphabet is wrong, a `publicKey` that is not a
        parsable SPKI PEM, a `proof` that is not standard padded base64 or does not decode to
        exactly 64 bytes, a `mode` outside the enum, a missing, unknown or duplicate field, a field
        that is not a string, bytes after the JSON value, or a body that is not a JSON object.

        **403** is the one uniform refusal for everything that needs the database or the
        signature check: an unknown, expired, used or revoked code, a key other than the one the
        code is bound to, a bad proof, a code issued under an instruction key that is no longer
        active, an owner who was disabled since issuance. The caller cannot tell these apart; the reason goes to the server's log only.
        Refusals are limited for the whole route, not per caller: once ten 403 responses were
        given within the last minute, a request that would be refused is answered 429 until the
        oldest of those ten is a minute old. Only 403 counts
        toward the limit (400, 405, 408, 413, 429 and 5xx do not). A request that redeems successfully (valid
        code, valid proof) succeeds even while the limit is exceeded, so the limit only slows
        guessing and gives a guesser no oracle. The body is at most 4 KiB (413).

        **503** is returned when the database cannot be reached or a statement fails or times out
        (5 seconds); **500** when the server's signer fails. Neither counts toward the limit, and
        the code stays redeemable, since the registration is written in one transaction that
        commits only after the response is signed.

        On success the server assigns the agent ID, stores the key and the owner, revokes earlier
        unrevoked rows of the same key, and returns the instruction key the agent will pin with
        its signature over what it assigned. The response is not replayed: an agent that did not
        receive it needs a new code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, publicKey, mode, proof]
              properties:
                code:
                  type: string
                  maxLength: 64
                  description: |
                    The registration code: the prefix `ngr1-` and 26 Crockford base32 digits. The
                    server reads it as the agent does (ASCII whitespace at the ends trimmed, case
                    ignored, `I` and `L` as `1`, `O` as `0`); its canonical text is hashed.
                publicKey:
                  type: string
                  maxLength: 512
                  description: The agent key as an SPKI PEM document
                mode: { type: string, enum: [user, device] }
                proof:
                  type: string
                  maxLength: 128
                  description: |
                    Standard padded base64 of the 64-byte signature that the agent key makes over
                    the registration transcript (the code's hash, the key's fingerprint, the mode
                    and the server key ID) under its own domain tag (`shared-crypto`'s
                    `registration` module)
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRegistration' }
        '400': { $ref: '#/components/responses/Problem' }
        '403':
          description: Refused. The same document for every reason
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429':
          description: Ten refusals were given in the last minute on this route; `Retry-After` is the time until the oldest is a minute old
          headers:
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 60 }, description: Seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/login:
    post:
      tags: [system]
      summary: Log a local user in (13.3, ADR-469)
      description: |
        Local deployment only. Checks a username and a password and, when they hold, starts an
        operator session: the answer sets the cookie `ngr_session` (`HttpOnly`,
        `SameSite=Strict`, `Path=/`, no `Max-Age`), which every operator route then takes. The
        session ends 8 hours after login or 30 minutes after its last use, whichever comes
        first, at a logout, when the operator is disabled or its password is set again, and when
        the server restarts. A token the request presents is never adopted, and a live session
        it presents is ended.

        The checks run in this order: the request guard (13.3), the method (**405**, with
        `Allow`), the Origin (**403** without one: the request must carry the pinned origin),
        the body (read within 5 seconds, **408**; at most 4 KiB, **413**), the shape (**400**:
        `Content-Type: application/json` and exactly the two string properties below), the
        lengths (**400**: a username of 1 to 256 bytes without control characters, a password
        of 1 to 1024 bytes), the limit (**429**), one database read (**503**, **500**), then the
        password (**401**).

        **429**: at most 10 attempts are admitted within a sliding minute; while 10 are recorded,
        every attempt is refused before any lookup, a right password included, and only a
        successful login gives its place back. A caller that keeps the limit full can deny
        logins for up to a minute at a time (ADR-469).

        **401** has one body, byte for byte, for an unknown username, an operator without a
        password, a disabled operator and a wrong password, and each costs the same password
        check. **500** also answers a stored password hash that cannot be read.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in; the answer sets `ngr_session` and is not cached
          headers:
            Set-Cookie: { schema: { type: string }, description: '`ngr_session=<43 base64url characters>; HttpOnly; SameSite=Strict; Path=/`' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: One body for an unknown username, an operator without a password, a disabled operator and a wrong password
          headers:
            WWW-Authenticate: { schema: { type: string }, description: '`Ngr-Session`' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429':
          description: 10 attempts are recorded in the last minute; `Retry-After` is the time until the oldest is a minute old
          headers:
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 60 }, description: Seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/logout:
    post:
      tags: [system]
      summary: End the operator session (13.3, ADR-469)
      description: |
        Ends every session whose well-formed `ngr_session` the request carries and clears the
        cookie. It answers **204** with or without a live session and reads no database, so it
        works for a disabled operator and while the database is down. The request must carry
        the pinned Origin (**403** without one) and an empty body (**400**; **413**, **408** as
        for login).
      security: []
      responses:
        '204':
          description: Logged out; the cookie is cleared
          headers:
            Set-Cookie: { schema: { type: string }, description: '`ngr_session=; Max-Age=0; Path=/; HttpOnly; SameSite=Strict`' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }

  /v1/me:
    get:
      tags: [system]
      summary: The operator of this session (13.3, ADR-469)
      description: |
        Answers the operator the session belongs to, with its name and roles read at this
        request. Like every operator route on the local deployment it needs a live session:
        without one, with a malformed or repeated `ngr_session`, after the session expired, or
        once the operator was disabled or its password set again, the answer is **401**, which
        clears a presented cookie. A database failure during the session check or the read is **503**
        (**500** for a fault of the query itself).
      security:
        - operatorSession: []
      responses:
        '200':
          description: The operator; not cached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '401':
          description: No live session; a presented `ngr_session` is cleared
          headers:
            WWW-Authenticate: { schema: { type: string }, description: '`Ngr-Session`' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '405':
          description: A method other than GET or HEAD
          headers:
            Allow: { schema: { type: string }, description: '`GET,HEAD`' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/agent/challenge:
    post:
      tags: [agents]
      summary: Get a connection challenge (6.4, 14.4, ADR-466)
      description: |
        The first step of an agent's proof that it holds its registered key. Needs no login: the
        agent has no session, and the request has no body to trust. The body must be empty
        (a non-empty body is **400**). The server answers with 32 random bytes that it keeps in
        memory for 60 seconds and removes at the first presentation, whatever the outcome. The
        store holds at most 1024 challenges and drops the oldest beyond that; the cap below keeps
        the live count far under it, so on one server none is dropped (ADR-467).

        Like registration the route has a 5 second body-read bound (**408**) and answers **405**
        with `Allow` to another method. It is subject to the Host and Origin rules of 13.3. A
        challenge says nothing about any agent, so the route has no refusal of its own and the
        limit on refusals does not apply to it. Issuing is limited on its own: at most 60
        challenges within a sliding minute on the route, then **429** with `Retry-After` (the
        time until the oldest of the 60 is a minute old). A request answered 429 is not
        recorded and issues nothing. A caller that uses the whole cap can deny challenges to
        honest agents for up to a minute (ADR-467).
      security: []
      responses:
        '200':
          description: A fresh challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionChallenge' }
        '400': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429':
          description: 60 challenges were issued in the last minute on this route; `Retry-After` is the time until the oldest is a minute old
          headers:
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 60 }, description: Seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /v1/agent/session:
    post:
      tags: [agents]
      summary: Exchange a signed challenge for a session token (6.4, 14.4, ADR-459, ADR-466)
      description: |
        The second step: the agent presents the challenge it got, a nonce it chose and its
        signature over the connection transcript (`shared-crypto`'s `proof` module: the
        protocol version, the audience, the agent ID, the challenge and the nonce, under the
        proof's domain tag). Needs no login. The audience is the server's own pinned origin
        (13.3): the server builds it itself and never reads one from the request.

        The checks run in this order: the request guard (13.3), the method (**405**, with
        `Allow`), the body (read within 5 seconds, **408**; at most 4 KiB, **413**), the shape
        (**400**, which uses up no challenge), the challenge (**401**), the agent's row
        (**503**, **500**), then the key and the proof (**403**, or **429**).

        **400** is decided on the shape of the request alone, before and without any lookup: a
        `Content-Type` other than `application/json` (parameters allowed), an `agentId` that is
        not a canonical lowercase UUID, a `challenge`, `nonce` or `proof` that is not standard
        padded base64 or does not decode to exactly 32, 32 and 64 bytes, a missing, unknown or
        duplicate field, a field that is not a string, bytes after the JSON value, or a body
        that is not a JSON object.

        **401** is for a challenge that is unknown, expired or already presented: the agent
        fetches a new one at once. The challenge is removed at this presentation whatever the
        outcome, so a refusal below uses it up too. A 401 is not counted by the refusal limiter
        and is never turned into a 429.

        **403** is the one uniform refusal for an unknown agent, a revoked row, a bad signature
        and a wrong audience. The caller cannot tell these apart; the reason goes to the
        server's log only, and the log is rate-bounded. Refusals are limited for the whole
        route as registration's are (ten 403 responses within the last minute, then **429**
        until the oldest is a minute old); only 403 counts, and a valid proof is never limited.
        A distinct answer for a revoked key waits for the work that authenticates the server to
        the agent, since the answer would be unauthenticated on the local profile.

        On success the server returns a token: 32 random bytes, of which it keeps only the
        SHA-256, valid for 300 seconds and reported as a relative time, since the device clock
        is untrusted (16.3). It is a bearer token that may be presented any number of times
        within that time. The agent sends it as `Authorization: Bearer <token>` on the upgrade of
        the control channel (`agentControl` in `api/asyncapi.yaml`), at `GET /api/v1/agent/control`
        with the subprotocol `ngr-control.v1`; a missing or expired token is answered 401 before
        any upgrade (with `WWW-Authenticate: Bearer`), and an upgrade without the subprotocol is
        answered 400. The agent takes a fresh exchange before every upgrade.

        **503** is returned when the database cannot be reached or a statement fails or times out
        (5 seconds); **500** for any other failure of the server, including a stored key that
        does not decode. Neither counts toward the limit, and the challenge stays used up. A
        stale or unknown challenge is answered 401 before the database is read, whatever else
        is wrong with the request.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agentId, challenge, nonce, proof]
              properties:
                agentId:
                  type: string
                  maxLength: 36
                  description: The ID registration assigned; a canonical lowercase UUID
                challenge:
                  type: string
                  maxLength: 64
                  description: Standard padded base64 of the 32 bytes that `/v1/agent/challenge` returned
                nonce:
                  type: string
                  maxLength: 64
                  description: Standard padded base64 of 32 random bytes the agent chose for this exchange
                proof:
                  type: string
                  maxLength: 128
                  description: |
                    Standard padded base64 of the 64-byte signature the agent key makes over the
                    transcript
      responses:
        '200':
          description: A session token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '400': { $ref: '#/components/responses/Problem' }
        '401':
          description: The challenge is unknown, expired or was presented before. Fetch a new one
          headers:
            WWW-Authenticate: { schema: { type: string }, description: '`Bearer`' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Refused. The same document for every reason
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429':
          description: Ten refusals were given in the last minute on this route; `Retry-After` is the time until the oldest is a minute old
          headers:
            Retry-After: { schema: { type: integer, minimum: 1, maximum: 60 }, description: Seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------ Data channel (5.2, 14.3, ADR-493)
  /v1/agent/uploads:
    post:
      tags: [agents]
      summary: Begin an upload of a job's object (5.2, 14.3, ADR-493)
      description: |
        The first of the four data-channel routes (this one, the part URL and the status are
        served; the completion is planned). The agent presents its session token (the one of
        `/v1/agent/session`) as a bearer header. Every request of these routes judges the
        token and then reads the agent's row: a missing or expired token, and a revoked or
        missing row, are all **401** (the same answer), and a revoked agent's tokens are
        dropped. A failed read is **503**. The body is a strict JSON object of at most 4 KiB
        read within 5 seconds (**408** when it does not arrive, **413** when it is larger); a
        wrong shape is **400**, judged before the token, and so is the length (**413**): both
        before any lookup. A malformed request does not drop any token.

        The body declares the object: the job, the ownership generation, the kind, the length
        (0 to 4 GiB) and the SHA-256 as 64 lowercase hex digits. There is no free-form
        metadata. A job that does not exist, is another agent's or whose stored instruction
        names another ownership generation than the one declared is **404**, in any state of
        the job; a length over 4 GiB is **413**. A length written
        with a fraction or an exponent is judged as a double: an integral value of 2^64 or more
        (`18446744073709551616`, `1e30`) is over the limit (**413**), any other (`1.5`, `5e9`, a
        negative number) and a number beyond a double (`1e400`) is **400**.
        Begin is idempotent per job, generation and kind: a row that is not
        `failed` and declares the same length and digest is answered **200**, one that declares
        another length or digest is **409**. Otherwise the server starts the multipart upload,
        inserts the row and answers **201**. Begin is allowed before the job's terminal event
        has reached the server.
      security:
        - agentSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadBegin' }
      responses:
        '200':
          description: The existing upload of this job, generation and kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '201':
          description: A new upload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AgentSessionRefused' }
        '404': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/agent/uploads/{uploadId}/parts/{part}:
    post:
      tags: [agents]
      summary: Get the URL for one part of an upload (14.3, ADR-493)
      description: |
        The body is empty (a byte of one is **400**, more than 4 KiB **413**). `part` is a
        number in canonical decimal, from 1 to 10000 and not past the upload's `partCount`,
        else **400**; the number is judged before the token. An upload ID that is not a UUID,
        that is unknown or that belongs to another agent or tenant is **404**. The row must be
        `open`, else **409**, which carries the row's `state`. The
        answer is one presigned PUT URL, valid 300 seconds, for that part. Asking again for a
        part already held is allowed and gives another URL. The agent sends the part only to a
        URL whose scheme and host are those of the origin it registered with (ADR-493 item 13).
        Token and agent row are judged as for begin.
      security:
        - agentSession: []
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: part, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        '200':
          description: The URL of the part
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadPartUrl' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AgentSessionRefused' }
        '404': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '409':
          description: The upload is not `open`; the body is a problem document with the row's `state`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/agent/uploads/{uploadId}:
    get:
      tags: [agents]
      summary: The state of an upload and the parts the store holds (14.3, ADR-493)
      description: |
        While the row is `open`, `partsHeld` is the count of leading parts, from part 1, that
        the store lists with the expected size (`partBytes` for each, the remainder for the
        last), counted up to the first part that is missing or has another size. The agent
        resumes from part `partsHeld + 1`. In any other state `partsHeld` is absent. An upload
        of another agent or tenant, an ID that is not a UUID and an unknown one are **404**.
        The body is empty, as for the part URL. Token and agent row are judged as for begin. An
        `open` row whose listing fails is **503** and the row is not changed. When the store
        lists the upload as gone (a completion may just have moved the row on) the row is read
        once more: a row that is no longer `open` is answered with its state, as for any
        other state; one that still is `open` is **503** and is not changed. `HEAD` is answered like `GET`, without a body.
      security:
        - agentSession: []
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The upload's state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadStatus' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AgentSessionRefused' }
        '404': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than GET and HEAD
          headers:
            Allow: { schema: { type: string }, description: '`GET,HEAD`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/agent/uploads/{uploadId}/complete:
    post:
      tags: [agents]
      summary: Complete an upload and verify the object (14.3, ADR-493, ADR-492)
      description: |
        The body is empty (any byte is **400**, more than 4 KiB **413**, a body that does not
        arrive within 5 seconds **408**). Token and agent row are judged as for begin; an upload
        of another agent or tenant, an ID that is not a UUID and an unknown one are **404**.
        A `finished` row is answered **200** and a `failed` row **409** with state `failed`, with
        no store call. Otherwise the server runs one completion task per upload, which moves the
        row from `open` to `completing` by a compare-and-set, runs the store's completion (it
        checks the parts, completes the upload, reads the object back and compares its length
        and SHA-256 with the row's) and then writes the result; the row becomes `finished` only
        after the verification. The task outlives the request, and every request for the
        upload waits for it up to 20 seconds: **200** `finished` when it is done, else **202**
        `completing`, and the agent repeats the request. A part problem (the parts are not as
        expected, or add up to another length) returns the row to `open` and answers **409**
        with state `open`; a length or digest mismatch makes the row `failed` with the object
        deleted and answers **409** with state `failed`, and the agent begins again; when the
        upload and the object are both gone (a stop between a mismatch's delete and the row's
        update), the row also becomes `failed` with **409**. Any other store error, a failed
        delete included, and a database failure write nothing more and answer **503**: the row
        is `completing` once the task began (a failed compare-and-set leaves it `open`), and
        the agent repeats the request. **500** is a stored value that does not parse, a store
        without randomness or a database error that is a fault of the server. A stop of the server ends the task and leaves the row `completing`; the next
        request resumes it.
      security:
        - agentSession: []
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The object is verified and the row is `finished`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadCompletion' }
        '202':
          description: The completion is still running; repeat the request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadCompletion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AgentSessionRefused' }
        '404': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '409':
          description: The upload cannot be completed as it is; `state` is `open` (send the parts again) or `failed` (begin again)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/agent/downloads:
    post:
      tags: [agents]
      summary: Get a presigned GET URL for a job's IR document or artifact (14.3, ADR-497)
      description: |
        The body names `jobId` (a canonical UUID), `generation` (the job's ownership generation,
        0 to 2^63-1), `kind` (`document` or `artifact`) and `sha256` (64 lowercase hex digits);
        an unknown, duplicate or null member is **400**, more than 4 KiB **413**, and a body
        that does not arrive within 5 seconds **408**, all judged before the token. Token and
        agent row are judged as for the upload routes: a revoked or missing agent is **401** and
        drops its tokens. The job must be the caller's, the generation must equal the one in the
        job's stored, signed instruction, and the digest must be named by that instruction: a
        `document` among its document hashes, an `artifact` as its artifact hash. The job's
        state plays no part. The object is found by tenant and digest among the objects the
        store has read back. An unknown job, another agent's or tenant's, another generation, a
        digest the instruction does not name and one no stored object answers are all the same
        **404**. The answer is one presigned GET URL, valid for at most 60 seconds (the signing time
        is cut to the second, so it lapses 59 to 60 seconds after its issue) and a bearer for its life,
        with `Cache-Control: no-store`; a URL is signed for each request (two in the same
        second may be identical) and nothing is written. The
        server asks the object store nothing, so an object it lost shows as the GET failing.
        The agent hashes the bytes against the instruction's hash before it uses them.
      security:
        - agentSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DownloadRequest' }
      responses:
        '200':
          description: The URL of the object
          headers:
            Cache-Control: { schema: { type: string }, description: '`no-store`' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadUrl' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AgentSessionRefused' }
        '404': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than POST
          headers:
            Allow: { schema: { type: string }, description: '`POST`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------ Documents
  /v1/documents/{sha256}:
    put:
      tags: [jobs]
      summary: Store an IR document by its SHA-256 (8.2.6, 14.3, ADR-500)
      description: |
        Stores the bytes of one IR document for the caller's tenant, so that a job can name it by
        this digest (11.1, ADR-454) and the agent can fetch it (ADR-497). The path is the
        document's SHA-256, 64 lowercase hex digits (**400** otherwise); the body is the raw
        bytes, with exactly one `Content-Type: application/octet-stream` (**400** otherwise), at
        most 16 MiB (**413**, before a byte is read when the length is declared, and as soon as
        a streamed body passes the bound). The body is read within 30 seconds (**408**); a broken
        body is **400**; each of them closes the connection.

        Like every operator route the request needs a live session and, as a PUT, the pinned
        Origin (**403**) before the cookie is read (**401**). The caller must hold the role
        `worker` with no scope, as job creation needs (6.8); otherwise **403**, judged before the
        body is read. At most two documents are stored at a time; another is **503** with
        `Retry-After`.

        A body that does not hash to the path is **400** with the `code` `DIGEST_MISMATCH`,
        also when the tenant already holds the digest. A body that
        `diag_ir::declaration::load_ecu_document` refuses (file identifier, structure, schema
        version, values), or whose metadata is out of bounds (a variant without a name; a text over
        256 bytes or with a control character; more than 1024 part numbers or software versions),
        is **400** with the `code` `INVALID_IR_DOCUMENT`. Neither problem repeats a value of the
        request. A tenant that already holds the digest gets **200** with no further check and
        nothing written; otherwise the server stores the object, reads it back and compares its
        length and SHA-256, and writes the tenant's row and an audit record, and answers **201**.
        Each tenant has a row and an object of its own for a digest. Two stores of one digest at
        once leave one row and one object, and both answer success (**201** and **200**). A server
        without an object store, an object store that fails and a database that does not answer are
        **503**; a fault of the server's own is **500**.
      security:
        - operatorSession: []
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 16777216 }
      responses:
        '200':
          description: The tenant already held the document; nothing was written
          headers:
            Cache-Control: { schema: { type: string }, description: '`no-store`' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentStored' }
        '201':
          description: The document was stored
          headers:
            Cache-Control: { schema: { type: string }, description: '`no-store`' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentStored' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '405':
          description: A method other than PUT
          headers:
            Allow: { schema: { type: string }, description: '`PUT`' }
        '408': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503':
          description: |
            The object store, the database or a free slot is not there; a refusal for a full
            slot carries `Retry-After`
          headers:
            Retry-After: { schema: { type: string }, description: Seconds; present when two stores are running }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------ Artifacts and extensions
  /v1/artifacts:
    post:
      x-ngr-status: planned
      tags: [artifacts]
      summary: Ingest an ECU artifact (11.2)
      description: |
        Stored without altering the bytes and identified by hash. No re-signing or decryption is performed.
        If there is no manifest, target models etc. are accepted as a declaration.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                declaredTargets:
                  type: array
                  items: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }

  /v1/artifacts/{digest}/publish:
    post:
      x-ngr-status: planned
      tags: [artifacts]
      summary: Publish a version (staged rollout)
      parameters:
        - name: digest
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rolloutPercent: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '204': { description: Published }

  /v1/extensions:
    post:
      x-ngr-status: planned
      tags: [extensions]
      summary: Ingest an extension package (9.4)
      description: |
        After validation, re-signed with the operator's distribution key (ingestion signature. 11.1).
        IR, screen/report definitions, record templates, message text, unit systems.
        VCI profiles are not ingested here; they are installed on devices outside this software (9.3).
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extension' }
        '422':
          description: Contains elements outside the supported subset (8.3). Returns a list of the offending locations
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------ Acquired data
  /v1/datasets/{datasetId}:
    get:
      x-ngr-status: planned
      tags: [data]
      summary: Return metadata for acquired data (4.5)
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dataset' }

  /v1/datasets/{datasetId}/series:
    get:
      x-ngr-status: planned
      tags: [data]
      summary: Read a time series at a specified resolution
      description: |
        Dedicated API that hides the storage format. Changing the implementation does not affect consumers.
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: fields
          in: query
          schema: { type: array, items: { type: integer } }
        - name: resolution
          in: query
          description: Number of points matching the screen width. Downsamples using min/max values
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesPage' }

  /v1/datasets/{datasetId}/annotations:
    post:
      x-ngr-status: planned
      tags: [data]
      summary: Add an annotation
      description: Values acquired from the vehicle cannot be edited. Annotations are separate records (4.3).
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Annotation' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Annotation' }

  /v1/datasets/{datasetId}/records:
    put:
      x-ngr-status: planned
      tags: [data]
      summary: Update a work record (3-way merge)
      description: |
        Detects conflicts using `baseVersion` and per-item versions (4.4).
        Auto-filled values (from the vehicle) cannot be edited.
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordUpdate' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordUpdate' }
        '409':
          description: Conflict. Returns the server's latest version and the base version
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/changes:
    get:
      x-ngr-status: planned
      tags: [data]
      summary: Change feed (4.4)
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes: { type: array, items: { type: object } }
                  nextCursor: { type: string }

  # ------------------------------------------------------------ SOVD
  /v1/sovd/components:
    get:
      x-ngr-status: planned
      tags: [sovd]
      summary: Component hierarchy (VCI → vehicle → ECU)
      responses:
        '200':
          content:
            application/json:
              schema: { type: object }

  /v1/sovd/components/{componentId}/data:
    get:
      x-ngr-status: planned
      tags: [sovd]
      description: Derived from IR data objects. Use WebSocket for 10ms-interval subscriptions
      parameters: [{ $ref: '#/components/parameters/ComponentId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

  /v1/sovd/components/{componentId}/faults:
    get:
      x-ngr-status: planned
      tags: [sovd]
      description: DTCs. Read-only; annotations only
      parameters: [{ $ref: '#/components/parameters/ComponentId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

  /v1/sovd/components/{componentId}/operations:
    get:
      x-ngr-status: planned
      tags: [sovd]
      parameters: [{ $ref: '#/components/parameters/ComponentId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

  /v1/sovd/components/{componentId}/updates:
    get:
      x-ngr-status: planned
      tags: [sovd]
      description: ECU reprogramming. Execution is mapped onto the job model
      parameters: [{ $ref: '#/components/parameters/ComponentId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    agentSession:
      type: http
      scheme: bearer
      bearerFormat: Agent session token
      description: |
        The token `POST /v1/agent/session` returns (6.4, ADR-466), valid 300 seconds. The data
        channel's routes judge it on every request, together with the agent's row (ADR-493).
    operatorSession:
      type: apiKey
      in: cookie
      name: ngr_session
      description: |
        The local deployment's operator session (13.3, ADR-469), set by `POST /v1/login`. A
        request whose method is not GET or HEAD must also carry the pinned Origin, or it is
        **403** before the cookie is read.

  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string }
    ComponentId:
      name: componentId
      in: path
      required: true
      schema: { type: string }

  responses:
    AgentSessionRefused:
      description: |
        The token is missing or expired, or the agent's row is revoked or missing; the same
        answer for each. A revoked agent's tokens are dropped
      headers:
        WWW-Authenticate: { schema: { type: string }, description: '`Bearer`' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, description: 'The operator''s username; 1 to 256 bytes, no control characters, compared exactly' }
        password: { type: string, minLength: 1, description: 'At most 1024 bytes' }
    Operator:
      type: object
      additionalProperties: false
      required: [operatorId, username, displayName, roles]
      properties:
        operatorId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string, enum: [viewer, worker, reprogrammer, remote, approver, admin] }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    UploadBegin:
      type: object
      additionalProperties: false
      required: [jobId, generation, kind, sizeBytes, sha256]
      properties:
        jobId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 0, maximum: 9223372036854775807, description: The job's ownership generation (ADR-229); the job's stored instruction must name it, else 404 }
        kind:
          type: string
          enum: [result, commLog]
          description: The run's final VM state as JSON, or the job's communication log (8.11)
        sizeBytes: { type: integer, minimum: 0, description: The length the agent declares; over 4 GiB (4294967296 bytes) is refused with 413, after the shape is judged }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the object, lowercase hex }
    Upload:
      type: object
      required: [uploadId, partBytes, partCount, state]
      properties:
        uploadId: { type: string, format: uuid, description: The row's ID; the store's key and upload ID never leave the server }
        partBytes: { type: integer, description: The part size the server set (5 MiB), kept in the row }
        partCount: { type: integer, minimum: 1, description: The length divided by the part size, rounded up, and at least 1 }
        state: { $ref: '#/components/schemas/UploadState' }
    UploadState:
      type: string
      enum: [open, completing, finished, failed]
    UploadPartUrl:
      type: object
      required: [url, expiresInSecs]
      properties:
        url: { type: string, description: A presigned PUT URL; a bearer for its life }
        expiresInSecs: { type: integer, description: 300 }
    DownloadRequest:
      type: object
      additionalProperties: false
      required: [jobId, generation, kind, sha256]
      properties:
        jobId: { type: string, format: uuid }
        generation: { type: integer, format: int64, minimum: 0 }
        kind: { type: string, enum: [document, artifact] }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    DownloadUrl:
      type: object
      required: [url, expiresInSecs]
      properties:
        url: { type: string, description: A presigned GET URL; a bearer for its life }
        expiresInSecs: { type: integer, description: '60: the URL lapses within 60 seconds of its issue (the signing time is cut to the second)' }
    DocumentStored:
      type: object
      additionalProperties: false
      required: [sha256]
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: The name in the path }
    UploadStatus:
      type: object
      required: [state, partBytes, partCount]
      properties:
        state: { $ref: '#/components/schemas/UploadState' }
        partBytes: { type: integer }
        partCount: { type: integer }
        partsHeld: { type: integer, minimum: 0, description: Present while the state is `open` }
    UploadCompletion:
      type: object
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/UploadState' }
    Problem:
      type: object
      description: RFC 9457. `code` holds a machine-readable value
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        state:
          description: The state of the upload the request found; present on the 409 of the part URL and of the completion
          allOf:
            - { $ref: '#/components/schemas/UploadState' }
        code:
          type: string
          enum:
            - DEVICE_LOCKED
            - VEHICLE_LOCKED
            - START_DEADLINE_OUT_OF_BOUNDS
            - DOCUMENT_NOT_STORED
            - ARTIFACT_NOT_STORED
            - DIGEST_MISMATCH
            - INVALID_IR_DOCUMENT
            - VIN_MISMATCH
            - VARIANT_MISMATCH
            - POWER_CONDITION
            - SIGNATURE_INVALID
            - UNSUPPORTED_ABI
            - GATEWAY_AUTH_REQUIRED
            - SEED_KEY_REQUIRED
            - AGENT_TOO_OLD
            - UNSUPPORTED_IR_SCHEMA
            - SUBSET_VIOLATION
            - CONFLICT

    JobRequest:
      type: object
      additionalProperties: false
      required: [kind, agentId, vciId, irDigests]
      description: |
        What `POST /v1/jobs` of the local deployment accepts: `kind` is `acquire` or
        `writeSettings`, and `executionWindow`, `onSiteContact`, a `parameters` that is not empty
        and a `remote` of `true` are refused (400): the server gives them no meaning.
      properties:
        kind:
          type: string
          enum: [acquire, monitorSession, monitorCapture, runSequence, writeSettings, reprogram, identify]
        agentId: { type: string, description: The target agent; a lowercase UUID }
        vciId: { type: string, minLength: 1, description: The VCI as the agent reported it; 1 to 1024 bytes of UTF-8 (the route counts bytes), no control characters }
        vin: { type: string, description: A well-formed VIN (17 characters, no I, O or Q) }
        irDigests:
          type: array
          minItems: 1
          maxItems: 128
          items: { type: string, pattern: '^[0-9a-f]{64}$' }
          description: |
            SHA-256 of each IR document of the job. The server writes them, sorted and without
            duplicates, into the signed instruction's `document_hashes` (ADR-454, ADR-461); an
            identification job names its documents through the plan instead.
        artifactDigest: { type: string, pattern: '^[0-9a-f]{64}$', description: Written into the signed instruction's `artifact_hash` }
        parameters:
          type: object
          additionalProperties: true
        startDeadline:
          type: string
          format: date-time
          description: |
            The latest time the job may be started, 60 to 86400 seconds after its issue time;
            default 900 seconds after it. Normalized to UTC whole seconds, signed into the
            instruction and stored on the row (ADR-487).
        executionWindow:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        remote: { type: boolean, description: Remote execution (requires the remote operator role and permission on the agent side)
        }
        onSiteContact: { type: string, description: Required for remote reprogramming }

    Job:
      type: object
      properties:
        jobId: { type: string }
        kind: { type: string }
        state:
          type: string
          description: |
            `expired` is also the server's end of a job still `received` at its start deadline
            (5.3, ADR-487), which has no `failure`.
          enum:
            [received, precheck, ready, running, verifying, awaitingHmi,
             cancelRequested, completed, failed, cancelled, expired,
             preconditionFailed, needsOnSiteRecovery]
        progressPermille: { type: integer }
        confirmation:
          type: object
          properties:
            level: { type: string, enum: [notifyOnly, gracePeriod, onSiteApproval, twoPerson] }
            approvedAt: { type: string, format: date-time }
            approvedBy: { type: string }
        failure:
          type: object
          description: |
            Present when the job ended as failed or preconditionFailed. The failure's detail is
            vehicle data and is not part of this resource (design 4.3, ADR-481).
          properties:
            code: { type: string, description: The failure code's name (5.6); one the agent sent that the server does not know is other }
            procedureCode: { type: string, description: With code procedure only, the code the procedure gave (1 to 128 bytes) }
        datasetId: { type: string }
        lastSeenAt: { type: string, format: date-time, description: Treated as running while disconnected }

    OfflinePackage:
      type: object
      properties:
        signedJob: { type: string, description: base64 of the same signed instruction envelope as the control channel's job command (11.1, ADR-461) }
        offlineToken: { type: string }
        expiresAt: { type: string, format: date-time, description: Informational only. The agent judges expiry by the signed instruction's start deadline }
        artifacts: { type: array, items: { type: string } }

    Agent:
      type: object
      properties:
        agentId: { type: string }
        displayName: { type: string }
        online: { type: boolean }
        mode: { type: string, enum: [user, device] }
        allowRemote: { type: boolean }
        preset: { type: string, enum: [personal, personalRemote, shared] }
        capabilities: { $ref: '#/components/schemas/Capabilities' }

    ConnectionChallenge:
      type: object
      description: A single-use challenge for one proof exchange (ADR-466). The agent reads it strictly (ADR-471).
      additionalProperties: false
      required: [challenge]
      properties:
        challenge: { type: string, description: Standard padded base64 of 32 random bytes; valid for 60 seconds and for one presentation }

    AgentSession:
      type: object
      description: |
        A session token for the control channel (ADR-466). It is a bearer token: whoever holds
        it can open the channel as the agent until it expires.
      additionalProperties: false
      required: [token, expiresInSecs]
      properties:
        token: { type: string, description: Standard padded base64 of 32 random bytes }
        expiresInSecs: { type: integer, minimum: 1, description: Seconds the token stays valid, counted from the answer (300) }

    AgentRegistration:
      type: object
      description: |
        What registration returns (ADR-463). The agent stores it as its registration record after
        it has checked that the instruction key's fingerprint equals the server key ID the operator
        gave it and that `signature` verifies. `capabilities` are not part of registration: the agent reports them after it
        connects (9.5). The agent reads it strictly: a property not listed here makes the answer
        unusable (ADR-470).
      additionalProperties: false
      required: [agentId, ownerId, preset, allowRemote, instructionKey, instructionKeyId, signature]
      properties:
        agentId: { type: string, description: Assigned by the server; a canonical lowercase UUID }
        ownerId: { type: string, description: The operator ID the code named at issuance (6.6) }
        preset: { type: string, enum: [personal, personalRemote, shared], description: Always `personal` in M3 (6.7) }
        allowRemote: { type: boolean }
        instructionKey: { type: string, description: The server's job instruction key as an SPKI PEM document (11.1) }
        instructionKeyId: { type: string, description: The SHA-256 of the key's SPKI document, 64 lowercase hex digits }
        signature:
          type: string
          description: |
            Standard padded base64 of the 64-byte signature that the instruction key makes over the
            response transcript (the code's hash, the agent key's fingerprint, `agentId`, `ownerId`,
            `preset` and `allowRemote`) under its own domain tag (`shared-crypto`'s `registration`
            module). The agent verifies it against `instructionKey`, after comparing that key's
            fingerprint with the server key ID, and stores nothing when it fails

    Capabilities:
      type: object
      description: 9.5. The server uses this to decide whether delivery is possible
      properties:
        agentVersion: { type: string }
        protocolVersion: { type: integer }
        platform:
          type: object
          properties:
            os: { type: string }
            nativeArch: { type: string }
            emulated: { type: boolean }
            mode: { type: string }
        workers:
          type: array
          items:
            type: object
            properties:
              abi: { type: string }
              available: { type: boolean }
              reason: { type: string }
        vcis:
          type: array
          items:
            type: object
            properties:
              vciId: { type: string }
              name: { type: string }
              vendor: { type: string }
              standard: { type: string }
              abiInterpretation: { type: string, enum: [standard, productDefined, inferred] }
              loadable: { type: boolean }
              reason: { type: string }
              signatureVerifier: { type: string, enum: [library, adapter, ecuOnly] }
        irSchemaVersions: { type: array, items: { type: integer } }
        extensionSchemaVersions: { type: array, items: { type: integer } }
        monitorDirect: { type: boolean }
        offlineCapable: { type: boolean }

    Artifact:
      type: object
      properties:
        digest: { type: string }
        size: { type: integer }
        declaredTargets: { type: array, items: { type: string } }
        manifestParsed: { type: boolean }
        signatureVerifier: { type: string, enum: [library, adapter, ecuOnly] }
        publishedAt: { type: string, format: date-time }

    Extension:
      type: object
      properties:
        id: { type: string, description: Reverse-domain format }
        version: { type: string }
        kind:
          type: string
          enum: [ir, screen, recordTemplate, message, unit]
        schemaVersion: { type: integer }
        license:
          type: object
          properties:
            origin: { type: string }
            scope: { type: string, enum: [tenantOnly, redistributable] }
        signedAt: { type: string, format: date-time }

    Dataset:
      type: object
      properties:
        datasetId: { type: string }
        jobId: { type: string }
        vin: { type: string }
        ecu:
          type: object
          properties:
            address: { type: string }
            partNumber: { type: string }
            swVersion: { type: string }
        vci:
          type: object
          properties:
            model: { type: string }
            serial: { type: string }
        versions:
          type: object
          properties:
            library: { type: string }
            ir: { type: string }
            agent: { type: string }
        clockOffsetMillis: { type: integer }
        capturedFromMonitor:
          type: object
          description: Only for capture (4.6)
          properties:
            route: { type: string, enum: [direct, relay] }
            measuredIntervalMillis: { type: integer }
            framesDropped: { type: integer }

    SeriesPage:
      type: object
      properties:
        fields: { type: array, items: { type: integer } }
        points:
          type: array
          description: With a resolution specified, [t, min, max] tuples
          items: { type: array, items: { type: number } }
        nextCursor: { type: string }

    Annotation:
      type: object
      properties:
        annotationId: { type: string }
        target: { type: string, description: DTC code or time range etc. }
        text: { type: string }
        verdict: { type: string, enum: [ok, needsCheck, ng] }
        author: { type: string }
        createdAt: { type: string, format: date-time }

    RecordUpdate:
      type: object
      description: Work record based on a record template (4.3.1)
      properties:
        templateId: { type: string }
        baseVersion: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string }
              value: {}
              version: { type: integer }
              origin: { type: string, enum: [manual, autoFilled] }
              reason: { type: string, description: Required when correcting }
