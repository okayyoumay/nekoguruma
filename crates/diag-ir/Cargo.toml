[package]
name = "diag-ir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
postcard.workspace = true
flatbuffers.workspace = true
thiserror.workspace = true

[build-dependencies]
# Builds the pinned flatc from source for `vendored-flatc` (schema/README.md).
flatc-fork = { version = "=0.6.0", optional = true }

[features]
# Regenerate `src/generated/ir_generated.rs` from `schema/ir.fbs` in the build script.
flatc = []
vendored-flatc = ["flatc", "dep:flatc-fork"]

[dev-dependencies]
serde_json.workspace = true
