[workspace]
resolver = "2"
members = [
    "crates/shared-proto",
    "crates/shared-crypto",
    "crates/diag-ir",
    "crates/diag-frontend",
    "crates/vendor-manifest",
    "crates/j2534-defs",
    "crates/worker-host",
    "crates/iso22900",
    "crates/iso22900-sys",
    "crates/iso22900-mock",
    "crates/iso22900-registry",
    "crates/iso22900-service",
    "crates/j2534-0404",
    "crates/j2534-0404-sys",
    "crates/j2534-0404-mock",
    "crates/j2534-0404-registry",
    "crates/j2534-0404-service",
    "crates/ngr-library-resolver",
    "crates/ngr-oplog",
    "crates/ngr-pinned-tls",
    "crates/vci-service-config",
    "crates/vci-service-interface",
    "crates/vci-service-launcher",
    "crates/server",
    "crates/agent",
    "crates/sim-vci",
    "crates/sim-ecu",
    "crates/ngr-hw-checks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

# Lints for every crate (each crate opts in with `[lints] workspace = true`). The policy, the staged
# adoption and how a crate that is not clean yet opts out with a crate-level `#[expect]` are in
# ADR-502. CI builds with `-D warnings`, so a `warn` here fails CI for rustc lints; Clippy lints are
# checked by the local `cargo clippy` run before a pull request.
[workspace.lints.rust]
unsafe_code = "deny"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_lifetimes = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
redundant_clone = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
# In-workspace
shared-proto = { path = "crates/shared-proto" }
shared-crypto = { path = "crates/shared-crypto" }
diag-ir = { path = "crates/diag-ir" }
vendor-manifest = { path = "crates/vendor-manifest" }
sim-ecu = { path = "crates/sim-ecu" }
j2534-defs = { path = "crates/j2534-defs" }
worker-host = { path = "crates/worker-host" }
iso22900 = { path = "crates/iso22900" }
iso22900-sys = { path = "crates/iso22900-sys" }
iso22900-mock = { path = "crates/iso22900-mock" }
iso22900-registry = { path = "crates/iso22900-registry" }
j2534-0404 = { path = "crates/j2534-0404" }
j2534-0404-sys = { path = "crates/j2534-0404-sys" }
j2534-0404-mock = { path = "crates/j2534-0404-mock" }
j2534-0404-registry = { path = "crates/j2534-0404-registry" }
ngr-library-resolver = { path = "crates/ngr-library-resolver" }
ngr-oplog = { path = "crates/ngr-oplog" }
ngr-pinned-tls = { path = "crates/ngr-pinned-tls" }
vci-service-config = { path = "crates/vci-service-config" }
vci-service-interface = { path = "crates/vci-service-interface" }
vci-service-launcher = { path = "crates/vci-service-launcher" }

# Common
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads the Web API and channel descriptions in `api/` in the tests that check them against the
# code (`crates/server/tests/postgres/api_spec.rs`). Dev-dependency only.
serde_norway = "0.9"
postcard = { version = "1", features = ["alloc"] }
flatbuffers = "25.12.19"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1"
portable-atomic = "1"
sha2 = "0.11.0"
# The agent key's signature primitive, used only through shared-crypto (ADR-459).
# TLS to the bundled object server (ADR-505): rustls with the aws-lc-rs provider, its tokio
# adapter, and rcgen for the self-signed certificate. No other provider is built.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# Wipes key material when it is dropped (the identity feature of ngr-pinned-tls, shared-crypto).
zeroize = "1"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std", "getrandom"] }
# The Starlark parser and AST, without the evaluator (ADR-254).
starlark_syntax = "0.14.2"

# Server / agent
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
getrandom = "0.4"
# Validates the server's database URL before sqlx sees it (ADR-458).
url = "2"
# The server's database access (ADR-458): no TLS and no `query!` macros; `migrate!` needs `macros`.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }

# Agent: discovery (7.1)
roxmltree = "0.21"
winreg = "0.56"

# Worker (keep dependencies minimal, since it is cross-built for 32-bit / ARM)

# starlark_syntax's lexer (generated by logos) recurses once per character of a long run of
# digits or spaces when built without optimisation, so a debug build of a test or a tool would
# overflow the stack on a large but valid procedure file (ADR-303).
[profile.dev.package.starlark_syntax]
opt-level = 1

# Argon2id at the local users' policy (19 MiB, two passes) takes seconds when built without
# optimisation, which would make every login in a debug build of the server's tests crawl
# (ADR-469).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
panic = "unwind" # Not abort, because catch_unwind is used at the FFI boundary
