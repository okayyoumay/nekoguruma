# Windows workers are built for *-pc-windows-gnullvm. Link the LLVM unwinder statically so the
# binaries do not need libunwind.dll next to them.
[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

# Resolve dependencies to versions that support the workspace's `rust-version` where one exists,
# so `cargo update` (and Dependabot, which runs it) does not raise the minimum Rust version.
[resolver]
incompatible-rust-versions = "fallback"
