// ParamItem is shared by both the read direction (ComParamResponse,
// UniqueRespIdTableResponse) and the write direction (SetComParamRequest,
// SetUniqueRespIdTableRequest). `param_name` only has meaning when writing --
// a server-produced ParamItem always sets `param_id`. Name resolution is
// CLL-independent (the same name always resolves to the same id regardless
// of which ComLogicalLink/protocol it is used on); whether the resolved id
// is actually usable on a given CLL is a separate, protocol-dependent check
// performed after resolution.
//
// Field tags 1-7 are unchanged from the pre-name-addressing schema
// (`com_param_id` simply became oneof member `param_id` at the same tag) --
// `param_name` uses a previously-unused tag instead of renumbering
// `com_param_class`/`param_data`, so a client compiled against the old
// schema still decodes correctly (see vci-service-interface's
// implementation-notes.md "Preserve backward compatibility for field tags
// and message semantics").
message ParamItem {
    oneof id {
        uint32 param_id = 1;
        string param_name = 8;
    }
    PDUParamClass com_param_class = 2;
    oneof param_data {
        // UNUM8, UNUM16 or UNUM32
        uint32 unum32 = 3;
        // SNUM8, SNUM16 or SNUM32
        sint32 snum32 = 4;
        // byte field
        bytes bytefield = 5;
        // long field
        ParamLongfield longfield = 6;
        // struct fields
        ParamStructfield structfield = 7;
    }
}

