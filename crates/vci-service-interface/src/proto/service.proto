// ============================================================================
// ERROR HANDLING
//
// ErrorDetail is attached to a failing RPC's gRPC Status via the rich error
// model (encoded as a google.rpc.Status carrying one google.protobuf.Any
// -packed ErrorDetail in the grpc-status-details-bin trailer). It replaces
// the removed GetLastError RPC: a client no longer makes a follow-up call to
// learn why a request failed or what the most recent async error event was
// for that handle -- both ride along on the same failing response. See
// docs/adr/ADR-105-rich-error-model-replaces-get-last-error.md.
//
// Async/background errors detected while no RPC is in flight for a handle
// (e.g. a poll-task-detected hard channel error) have no failing RPC to
// attach to; those remain visible only via SubscribeEvent/GetEventItem's
// error_data EventItem variant.
// ============================================================================

// The PDUGetLastError-equivalent: the most recent asynchronous error event
// for the handle scope of the RPC that failed, fetched best-effort at
// failure time. A second, independent error taxonomy from ErrorDetail's own
// `pdu_error` -- PDUErrorEvent is async/event-class (e.g. lost comm to VCI),
// while `pdu_error` is the synchronous function-return code.
message ErrorEventData {
    PDUErrorEvent error_event = 1;
    optional ComPrimitiveHandle cop_handle = 2;
    uint32 timestamp = 3;
    uint32 extra_error_info = 4;
}

message ErrorDetail {
    // Synchronous function-return error code (ISO 22900-2 PDUError).
    PDUError pdu_error = 1;
    // Absent when no Module/CLL handle was in scope for the failing RPC, or
    // the best-effort fetch itself failed.
    optional ErrorEventData error_event_data = 2;
    // Vendor/adapter free-text detail (e.g. J2534 PassThruGetLastError text,
    // or adapter-layer diagnostic context not present at the driver layer).
    // Absent when unavailable.
    optional string detail_text = 3;
}

