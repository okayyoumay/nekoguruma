# Windows workers are built for *-pc-windows-gnullvm. Link the LLVM unwinder statically so the
# binaries do not need libunwind.dll next to them.
[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

# Prefer dependency versions that support the workspace's `rust-version`, so `cargo update` (and
# Dependabot, which runs it) does not raise the minimum Rust version when a compatible version
# exists. This is only a preference: when no compatible version satisfies a requirement, Cargo
# still picks an incompatible one; the `msrv` job in .github/workflows/ci.yml catches that.
[resolver]
incompatible-rust-versions = "fallback"
